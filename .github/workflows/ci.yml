# ============================================================
# CI — la API (Spring Boot), la web de administración (admin/) y la app Android (app/)
# Se ejecuta en cada push a main y en cada pull request.
# api-build-test es el gate que valida el auto-merge de Dependabot antes de fusionar.
#
# Un cambio solo en admin/ no lanza la API (GP-121). No se hace con paths-ignore
# en el disparador: un workflow que no arranca deja el check requerido «esperando»
# para siempre y colgaría el auto-merge. El workflow arranca siempre, el job
# «cambios» mira qué se ha tocado, y el job que no toca se salta: un job saltado
# cuenta como superado para los checks requeridos.
# ============================================================
name: CI

on:
  push:
    branches: [ main ]
    # Los commits solo-documentación (p. ej. actualizar CHANGELOG con el hash) NO
    # disparan CI: así el run del commit de código anterior no queda "cancelado"
    # por el push del changelog. En los PR NO se ignora nada (el gate de Dependabot
    # siempre corre).
    paths-ignore:
      - '**/*.md'
      - 'documentacion/**'
  pull_request:

# Cancela ejecuciones antiguas de la misma rama/PR si llega un push nuevo
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------
  # Qué se ha tocado: la API corre salvo que todo lo cambiado esté en admin/;
  # la web, si algo de admin/ ha cambiado; la app, si algo de app/ o este mismo
  # workflow ha cambiado (GP-126). Ante la duda (primer push de una rama, historia
  # reescrita), corren las tres.
  # ----------------------------------------------------------
  cambios:
    name: cambios
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.ver.outputs.api }}
      admin: ${{ steps.ver.outputs.admin }}
      app: ${{ steps.ver.outputs.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ver qué ha cambiado
        id: ver
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "Sin base con la que comparar: corren la API, la web y la app."
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "admin=true" >> "$GITHUB_OUTPUT"
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FICHEROS=$(git diff --name-only "$BASE" HEAD)
          echo "$FICHEROS"
          if printf '%s\n' "$FICHEROS" | grep -qv '^admin/'; then echo "api=true" >> "$GITHUB_OUTPUT"; else echo "api=false" >> "$GITHUB_OUTPUT"; fi
          if printf '%s\n' "$FICHEROS" | grep -q '^admin/'; then echo "admin=true" >> "$GITHUB_OUTPUT"; else echo "admin=false" >> "$GITHUB_OUTPUT"; fi
          if printf '%s\n' "$FICHEROS" | grep -qE '^(app/|\.github/workflows/ci\.yml$)'; then echo "app=true" >> "$GITHUB_OUTPUT"; else echo "app=false" >> "$GITHUB_OUTPUT"; fi

  api-build-test:
    name: api-build-test
    needs: cambios
    if: needs.cambios.outputs.api == 'true'
    runs-on: ubuntu-latest

    # Todos los pasos Maven corren dentro del módulo de la API
    defaults:
      run:
        working-directory: api/gymprofit-api

    # ----------------------------------------------------------
    # Service container: MariaDB efímera para los @SpringBootTest.
    # Flyway crea el esquema y Hibernate (ddl-auto=validate) lo valida.
    # ----------------------------------------------------------
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: "12345"
          MARIADB_DATABASE: gymprofit_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      # 1) Clona el repo
      - name: Checkout
        uses: actions/checkout@v7

      # 2) JDK 21 (Temurin) + cache de dependencias Maven
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # 3) Build + tests con el perfil 'ci' (application-ci.properties: datasource
      #    a la MariaDB efímera + secreto JWT no productivo). El perfil dev/prod
      #    NO se versiona, por eso se usa uno propio para CI.
      #    jOOQ compila desde las fuentes versionadas (src/generated/jooq); no
      #    se regenera (skip=true), así no hace falta BD en fase de compilación.
      - name: Build & test
        env:
          SPRING_PROFILES_ACTIVE: ci
          # El logback escribe en /home/ubuntu/logs por defecto (ruta del server);
          # en el runner se redirige a un dir escribible del temporal.
          LOG_DIR: ${{ runner.temp }}/gymprofit-logs
        run: sh ./mvnw -B verify

  # ----------------------------------------------------------
  # Web de administración: instalar, tests, compilar y el detector de Impeccable,
  # con versión fija (la del motor de la skill). El detector falla con cualquier
  # hallazgo, también los avisos: lo que choque con el diseño aprobado se deja
  # como excepción con su motivo (npx impeccable ignores), no se tolera aquí.
  # ----------------------------------------------------------
  admin-build-test:
    name: admin-build-test
    needs: cambios
    if: needs.cambios.outputs.admin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Instalar
        run: npm ci

      - name: Tests
        run: npm test

      - name: Compilar
        run: npm run build

      - name: Detector de Impeccable
        run: |
          npx -y impeccable@4.0.0 detect --json src > "$RUNNER_TEMP/impeccable.json" || true
          node -e '
            const h = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            if (h.length) { console.error(JSON.stringify(h, null, 2)); process.exit(1); }
            console.log("Impeccable: sin hallazgos.");
          ' "$RUNNER_TEMP/impeccable.json"

  # ----------------------------------------------------------
  # App Android (GP-126): compila el debug y pasa los tests unitarios, como un clon
  # limpio. Sin secretos: no hay keystore.properties (la firma de release solo existe
  # si lo hay, y aquí no se empaqueta release), ni local.properties (el BASE_URL por
  # defecto es el del emulador), y el google-services.json es de mentira: el plugin de
  # Firebase solo necesita que exista y que su package_name sea el applicationId.
  # ----------------------------------------------------------
  android-build-test:
    name: android-build-test
    needs: cambios
    if: needs.cambios.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/GymProFit
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # El plugin de Android (AGP 9.2) pide JDK 17 como mínimo
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Caché de Gradle (dependencias y wrapper)
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: google-services.json de mentira
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "gymprofit-ci",
              "storage_bucket": "gymprofit-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.gymprofit.app" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "ci-sin-clave" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      # sh ./ y no ./: el wrapper está versionado sin bit de ejecución
      - name: Build & test
        run: sh ./gradlew --no-daemon assembleDebug test

      # Lint de Android en verde (GP-155): un error de lint para el CI, como un test.
      - name: Lint
        run: sh ./gradlew --no-daemon lintDebug
