# ============================================================
# CI — la API (Spring Boot), la web de administración (admin/) y la app Android (app/)
# Se ejecuta en cada push a main y en cada pull request.
# api-build-test es el gate que valida el auto-merge de Dependabot antes de fusionar.
#
# Un cambio solo en admin/ no lanza la API (GP-121). No se hace con paths-ignore
# en el disparador: un workflow que no arranca deja el check requerido «esperando»
# para siempre y colgaría el auto-merge. El workflow arranca siempre, el job
# «cambios» mira qué se ha tocado, y el job que no toca se salta: un job saltado
# cuenta como superado para los checks requeridos.
# ============================================================
name: CI

on:
  push:
    branches: [ main ]
    # Los commits solo-documentación (p. ej. actualizar CHANGELOG con el hash) NO
    # disparan CI: así el run del commit de código anterior no queda "cancelado"
    # por el push del changelog. En los PR NO se ignora nada (el gate de Dependabot
    # siempre corre).
    paths-ignore:
      - '**/*.md'
      - 'documentacion/**'
  pull_request:

# Cancela ejecuciones antiguas de la misma rama/PR si llega un push nuevo
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------
  # Qué se ha tocado: la API corre salvo que todo lo cambiado esté en admin/;
  # la web, si algo de admin/ ha cambiado; la app, si algo de app/ o este mismo
  # workflow ha cambiado (GP-126). Ante la duda (primer push de una rama, historia
  # reescrita), corren las tres.
  # ----------------------------------------------------------
  cambios:
    name: cambios
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.ver.outputs.api }}
      admin: ${{ steps.ver.outputs.admin }}
      app: ${{ steps.ver.outputs.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ver qué ha cambiado
        id: ver
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "Sin base con la que comparar: corren la API, la web y la app."
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "admin=true" >> "$GITHUB_OUTPUT"
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FICHEROS=$(git diff --name-only "$BASE" HEAD)
          echo "$FICHEROS"
          if printf '%s\n' "$FICHEROS" | grep -qv '^admin/'; then echo "api=true" >> "$GITHUB_OUTPUT"; else echo "api=false" >> "$GITHUB_OUTPUT"; fi
          if printf '%s\n' "$FICHEROS" | grep -q '^admin/'; then echo "admin=true" >> "$GITHUB_OUTPUT"; else echo "admin=false" >> "$GITHUB_OUTPUT"; fi
          if printf '%s\n' "$FICHEROS" | grep -qE '^(app/|\.github/workflows/ci\.yml$)'; then echo "app=true" >> "$GITHUB_OUTPUT"; else echo "app=false" >> "$GITHUB_OUTPUT"; fi

  api-build-test:
    name: api-build-test
    needs: cambios
    if: needs.cambios.outputs.api == 'true'
    runs-on: ubuntu-latest

    # Todos los pasos Maven corren dentro del módulo de la API
    defaults:
      run:
        working-directory: api/gymprofit-api

    # ----------------------------------------------------------
    # Service container: MariaDB efímera para los @SpringBootTest.
    # Flyway crea el esquema y Hibernate (ddl-auto=validate) lo valida.
    # ----------------------------------------------------------
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: "12345"
          MARIADB_DATABASE: gymprofit_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      # 1) Clona el repo
      - name: Checkout
        uses: actions/checkout@v7

      # 2) JDK 21 (Temurin) + cache de dependencias Maven
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # 3) Build + tests con el perfil 'ci' (application-ci.properties: datasource
      #    a la MariaDB efímera + secreto JWT no productivo). El perfil dev/prod
      #    NO se versiona, por eso se usa uno propio para CI.
      #    jOOQ compila desde las fuentes versionadas (src/generated/jooq); no
      #    se regenera (skip=true), así no hace falta BD en fase de compilación.
      - name: Build & test
        env:
          SPRING_PROFILES_ACTIVE: ci
          # El logback escribe en /home/ubuntu/logs por defecto (ruta del server);
          # en el runner se redirige a un dir escribible del temporal.
          LOG_DIR: ${{ runner.temp }}/gymprofit-logs
        run: sh ./mvnw -B verify

  # ----------------------------------------------------------
  # Web de administración: instalar, tests, compilar y el detector de Impeccable,
  # con versión fija (la del motor de la skill). El detector falla con cualquier
  # hallazgo, también los avisos: lo que choque con el diseño aprobado se deja
  # como excepción con su motivo (npx impeccable ignores), no se tolera aquí.
  # ----------------------------------------------------------
  admin-build-test:
    name: admin-build-test
    needs: cambios
    if: needs.cambios.outputs.admin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Instalar
        run: npm ci

      - name: Tests
        run: npm test

      - name: Compilar
        run: npm run build

      - name: Detector de Impeccable
        run: |
          npx -y impeccable@4.0.0 detect --json src > "$RUNNER_TEMP/impeccable.json" || true
          node -e '
            const h = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            if (h.length) { console.error(JSON.stringify(h, null, 2)); process.exit(1); }
            console.log("Impeccable: sin hallazgos.");
          ' "$RUNNER_TEMP/impeccable.json"

  # ----------------------------------------------------------
  # App Android (GP-126): compila el debug y pasa los tests unitarios, como un clon
  # limpio. Sin secretos: no hay keystore.properties (la firma de release solo existe
  # si lo hay, y aquí no se empaqueta release), ni local.properties (el BASE_URL por
  # defecto es el del emulador), y el google-services.json es de mentira: el plugin de
  # Firebase solo necesita que exista y que su package_name sea el applicationId.
  # ----------------------------------------------------------
  android-build-test:
    name: android-build-test
    needs: cambios
    if: needs.cambios.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/GymProFit
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # El plugin de Android (AGP 9.2) pide JDK 17 como mínimo
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Caché de Gradle (dependencias y wrapper)
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Versionado en ci/ con otro nombre: google-services.json está en el .gitignore.
      # Lo comparte con app-release-r8.
      - name: google-services.json de mentira
        run: cp ci/google-services-ci.json app/google-services.json

      # sh ./ y no ./: el wrapper está versionado sin bit de ejecución
      - name: Build & test
        run: sh ./gradlew --no-daemon assembleDebug test

      # Lint de Android en verde (GP-155): un error de lint para el CI, como un test.
      - name: Lint
        run: sh ./gradlew --no-daemon lintDebug

  # ----------------------------------------------------------
  # La release con R8 en un emulador (GP-247). R8 quita lo que solo se nombra por reflexión
  # y la debug no lo enseña: en el lote 7 quitó BurbujaProfi y la release se cerraba al abrir
  # Inicio, y solo se vio al llegar a producción. Aquí se compila la release de verdad (R8 y
  # shrinkResources), firmada con la clave de depuración (-PreleaseCi: ni la firma real ni
  # secretos), se instala en un emulador y ci/humo-release.sh la recorre con y sin sesión.
  #
  # Con sesión, contra una API local y no contra producción: la del commit, con el perfil ci y
  # la MariaDB efímera, como api-build-test. -PreleaseCi apunta la release a 10.0.2.2 (el
  # anfitrión visto desde el emulador) y la cuenta es de usar y tirar, creada aquí por
  # /auth/register con una clave aleatoria enmascarada.
  #
  # Mismas condiciones que android-build-test: saltado cuenta como superado.
  # ----------------------------------------------------------
  app-release-r8:
    name: app-release-r8
    needs: cambios
    if: needs.cambios.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: "12345"
          MARIADB_DATABASE: gymprofit_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      AVD_API: 34
      AVD_TARGET: google_apis
      AVD_ARCH: x86_64
      # Pantalla de móvil de verdad (1080 × 2400): el AVD por defecto es de 320 × 640 y
      # deja botones fuera de la pantalla.
      AVD_PROFILE: pixel_6

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 17 para Gradle (AGP 9.2) y 21 para la API; la última de la lista queda por defecto.
      - name: Set up JDK 17 y 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21
          cache: maven

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # El emulador necesita KVM: en los runners de Ubuntu hay que abrirlo al usuario.
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Se empaqueta sin tests (los pasa api-build-test) y se deja arrancando mientras se
      # compila la app.
      - name: API local
        working-directory: api/gymprofit-api
        env:
          SPRING_PROFILES_ACTIVE: ci
          LOG_DIR: ${{ runner.temp }}/gymprofit-logs
        run: |
          sh ./mvnw -B -q -DskipTests package
          # Con cada ruta que llega en el log (sin cuerpos): se sube con las capturas.
          nohup java -jar target/gymprofit-api-*.jar             --logging.level.org.springframework.security.web.FilterChainProxy=DEBUG             > "$RUNNER_TEMP/api.log" 2>&1 &

      - name: Release con R8 (firma de depuración)
        working-directory: app/GymProFit
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          cp ci/google-services-ci.json app/google-services.json
          sh ./gradlew --no-daemon assembleRelease -PreleaseCi

      # Cualquier respuesta vale para saber que ha arrancado: el health puede dar 503 por
      # componentes que en CI no existen (el correo) y aun así servir el login.
      - name: Cuenta de usar y tirar
        run: |
          for _ in $(seq 1 90); do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/actuator/health || true)
            [ "$codigo" != "000" ] && break
            sleep 2
          done
          [ "$codigo" != "000" ] || { echo "::error::La API local no arranca"; tail -100 "$RUNNER_TEMP/api.log"; exit 1; }
          CLAVE=$(openssl rand -hex 16)
          echo "::add-mask::$CLAVE"
          echo "HUMO_CLAVE=$CLAVE" >> "$GITHUB_ENV"
          curl -sf -o /dev/null -X POST http://localhost:8080/api/auth/register \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"humoci\",\"email\":\"humo@ci.invalid\",\"password\":\"$CLAVE\",\"nombre\":\"Humo\",\"peso\":75,\"altura\":178,\"edad\":30,\"nivelExperiencia\":\"intermedio\"}" \
            || { echo "::error::No se pudo crear la cuenta de usar y tirar"; tail -50 "$RUNNER_TEMP/api.log"; exit 1; }

      # Caché del AVD con su instantánea de arranque: con ella el emulador arranca en segundos.
      # Se restaura aquí y se guarda justo después de crearlo, no al final del job: con
      # actions/cache a secas se guardaba tras la prueba, con la app instalada y su sesión
      # dentro, y el run siguiente arrancaba con esa sesión vieja.
      - name: Caché del AVD
        id: avd
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.AVD_API }}-${{ env.AVD_TARGET }}-${{ env.AVD_ARCH }}-${{ env.AVD_PROFILE }}-v3

      - name: Crear el AVD y su instantánea
        if: steps.avd.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.AVD_API }}
          target: ${{ env.AVD_TARGET }}
          arch: ${{ env.AVD_ARCH }}
          profile: ${{ env.AVD_PROFILE }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD creado con su instantánea."

      - name: Guardar el AVD limpio
        if: steps.avd.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.avd.outputs.cache-primary-key }}

      - name: Humo de la release
        uses: reactivecircus/android-emulator-runner@v2
        env:
          HUMO_SALIDA: ${{ runner.temp }}/humo
        with:
          api-level: ${{ env.AVD_API }}
          target: ${{ env.AVD_TARGET }}
          arch: ${{ env.AVD_ARCH }}
          profile: ${{ env.AVD_PROFILE }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: sh app/GymProFit/ci/humo-release.sh app/GymProFit/app/build/outputs/apk/release/app-release.apk humoci

      # Capturas de cada pantalla y el logcat, también si ha fallado.
      - name: Capturas y logcat
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/humo"
          cp "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/humo/" 2>/dev/null || true

      - name: Subir capturas y logcat
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: humo-release
          path: ${{ runner.temp }}/humo
          if-no-files-found: ignore
          retention-days: 7
