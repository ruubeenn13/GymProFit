plugins {
    alias(libs.plugins.android.application)
    // Licencias de terceros: recoge las de cada dependencia en la compilación (GP-082)
    alias(libs.plugins.oss.licenses)
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    def keystoreProps = new Properties()
    def keystorePropsFile = rootProject.file("keystore.properties")
    if (keystorePropsFile.exists()) {
        keystoreProps.load(new FileInputStream(keystorePropsFile))
    }

    namespace 'es.pmdm.gymprofit'
    compileSdk 36

    defaultConfig {
        // Identidad de la app en Play y en cada instalación. NO es el paquete Java:
        // el namespace de arriba sigue siendo es.pmdm.gymprofit y son dos ajustes
        // independientes desde AGP 7. Tras la primera publicación esto ya no se puede
        // cambiar nunca —queda en la URL de la ficha y en cada dispositivo—, de ahí
        // que se fije antes de subir nada (DEC-030).
        applicationId "com.gymprofit.app"
        minSdk 24
        targetSdk 36
        // Versión a lo Minecraft: MAYOR.MENOR.PARCHE (1.0.0, 1.0.1, 1.1.0… y 2.0.0 solo
        // en un salto grande). Solo se toca versionName. versionCode —el número interno
        // que Android exige que suba en cada entrega para instalar encima— se deriva de
        // él: 1.0.0 → 10000, 1.0.1 → 10001, 1.2.3 → 10203. Cada parte admite hasta 99.
        versionName "1.0.1"
        versionCode versionName.tokenize('.').collect { it as int }
                .with { it[0] * 10000 + it[1] * 100 + it[2] }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        def localProps = new Properties()
        def localPropsFile = rootProject.file("local.properties")
        if (localPropsFile.exists()) {
            localProps.load(new FileInputStream(localPropsFile))
        }
        // BASE_URL por defecto = desarrollo (emulador -> API local). Se puede
        // sobrescribir en local.properties. En release se fuerza la URL de producción
        // (ver buildTypes.release), así el APK real apunta a Render sin tocar nada.
        def devBaseUrl = localProps['BASE_URL'] ?: 'http://10.0.2.2:8080/api/'

        // Guarda de aislamiento: el build de desarrollo SOLO puede apuntar a la red
        // local (emulador, localhost o LAN). Si alguien pone en local.properties la
        // URL de producción, el build falla aquí en vez de escribir en Render sin
        // que nadie se entere. La URL de producción vive únicamente en
        // buildTypes.release, que sobrescribe este valor.
        def hostsLocales = ~/^http:\/\/(10\.0\.2\.2|localhost|127\.0\.0\.1|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})(:\d+)?\/api\/$/
        if (!(devBaseUrl ==~ hostsLocales)) {
            throw new GradleException(
                    "BASE_URL de desarrollo apunta fuera de la red local: '${devBaseUrl}'.\n" +
                    "El build de desarrollo no puede escribir en producción. Corrige BASE_URL en " +
                    "local.properties (por ejemplo http://10.0.2.2:8080/api/ para el emulador).")
        }

        buildConfigField "String", "BASE_URL", "\"${devBaseUrl}\""
    }

    signingConfigs {
        release {
            storeFile file(keystoreProps['storeFile'])
            storePassword keystoreProps['storePassword']
            keyAlias keystoreProps['keyAlias']
            keyPassword keystoreProps['keyPassword']
        }
    }

    buildTypes {
        debug {
            // Desarrollo: API local (hereda el BASE_URL del defaultConfig, ya validado
            // contra hosts locales). http en claro permitido solo aquí vía
            // network-security-config.
            //
            // Crashlytics desactivado: los fallos de un build de pruebas no deben
            // mezclarse con los de producción en la consola de Firebase. El plugin
            // tampoco sube el mapa de ofuscación desde aquí.
            firebaseCrashlytics {
                mappingFileUploadEnabled false
            }
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Producción: dominio propio (HTTPS). Sobrescribe el BASE_URL del defaultConfig.
            //
            // El host es del PRODUCTO, no del proveedor. No es cosmética: BASE_URL se
            // compila dentro del APK como constante, así que cada instalación se queda
            // para siempre con el host que tuviera el día que se instaló. Con
            // gymprofit-api.onrender.com aquí, mudarse de Render obligaría a publicar
            // una versión nueva y a esperar a que todo el mundo la instalara; con
            // api.gymprofit.app basta con mover el CNAME (ver DEC-029).
            //
            // No revertir a la URL de onrender.com pensando que es un despiste: el
            // servicio de Render sigue existiendo —es el destino del CNAME y lo usan
            // las builds ya instaladas—, pero los APK nuevos no deben nombrarlo.
            buildConfigField "String", "BASE_URL", "\"https://api.gymprofit.app/api/\""
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    // Navegación principal por pestañas: 1 Activity + ViewPager2 + Fragments
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.fragment:fragment:1.8.5'
    // Cifrado del token/refresh en almacenamiento (EncryptedSharedPreferences)
    implementation libs.security.crypto
    // Carga de imágenes remotas (catálogo de ejercicios wger, futuras fotos)
    implementation libs.glide
    // Gráficas (peso corporal, kcal/macros, progresión por ejercicio)
    implementation libs.mpandroidchart
    // Red: Retrofit + OkHttp (motor HTTP, interceptor de token y Authenticator de refresh)
    implementation libs.retrofit.core
    // Converter Gson: deserializa las respuestas JSON a POJOs tipados (etapa 2)
    implementation libs.retrofit.gson
    implementation libs.gson
    implementation libs.okhttp.core
    implementation libs.okhttp.logging
    // Pantalla de licencias de terceros generada por el plugin. No es una comodidad:
    // Apache 2.0 pide acompañar la redistribución con su aviso (GP-082)
    implementation libs.oss.licenses
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    implementation platform('com.google.firebase:firebase-bom:34.15.0')
    implementation 'com.google.firebase:firebase-analytics'
    // Cloud Messaging: recepción de notificaciones push (versión fijada por el BOM)
    implementation 'com.google.firebase:firebase-messaging'
    // Crashlytics: reporte automático de crashes en producción (versión por el BOM)
    implementation 'com.google.firebase:firebase-crashlytics'
}