<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Lo que hace GymProFit. Entrenar: sesión en vivo con series, pistas de la última vez y descanso con alarma. Nutrición: escáner, búsqueda en 198.000 productos, favoritos y copiar la comida de ayer. Progreso: récords, mediciones, objetivos y logros. Avisos: diez recordatorios push en español e inglés.</title>
<style>
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}

.sube{animation:sube .8s cubic-bezier(.05,.7,.1,1) both}
@keyframes sube{from{opacity:0;transform:translateY(12px)}}
.vacia{animation:vacia 6s linear infinite}
@keyframes vacia{from{stroke-dashoffset:0}to{stroke-dashoffset:var(--c)}}
.escanea{animation:escanea 2.2s ease-in-out infinite alternate}
@keyframes escanea{from{transform:translateY(0)}to{transform:translateY(50px)}}
.crece{transform-box:fill-box;transform-origin:bottom;animation:crece 3.2s cubic-bezier(.2,0,0,1) infinite}
@keyframes crece{0%{transform:scaleY(0)}35%,85%{transform:scaleY(1)}100%{transform:scaleY(0)}}
.campana{transform-origin:0 -20px;animation:campana 2.4s ease-in-out infinite}
@keyframes campana{0%,60%,100%{transform:rotate(0)}66%{transform:rotate(14deg)}74%{transform:rotate(-12deg)}82%{transform:rotate(8deg)}90%{transform:rotate(-4deg)}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop 2.4s ease-in-out infinite}
@keyframes pop{0%,55%{transform:scale(0)}66%{transform:scale(1.25)}74%,100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.sube,.vacia,.escanea,.crece,.campana,.pop{animation:none}}
</style>
<g class="sube" style="animation-delay:0s" transform="translate(18,18)">
<rect width="423" height="160" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="22" y="34" class="m" font-size="11" fill="#c2410c" font-weight="600" letter-spacing="1.4">01 · ENTRENAR</text>
<text x="22" y="64" class="s" font-size="22" fill="#1f2328" font-weight="700">Sesión en vivo</text>
<text x="22" y="96" class="s" font-size="13.5" fill="#59636e">Series, pistas de la última vez y descanso</text>
<text x="22" y="118" class="s" font-size="13.5" fill="#59636e">con alarma aunque la pantalla esté apagada.</text>
<g transform="translate(311,24)"><rect width="90" height="112" rx="10" fill="#ffffff" stroke="#eaeef2"/>
<g transform="translate(45,52)"><circle r="30" fill="none" stroke="#e1e6eb" stroke-width="6"/>
<circle r="30" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-dasharray="188.5" transform="rotate(-90)" class="vacia" style="--c:188.5"/>
<text y="6" class="m" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">1:30</text></g>
<text x="45" y="102" class="m" font-size="10" fill="#59636e" text-anchor="middle">DESCANSO</text></g>
</g><g class="sube" style="animation-delay:0.12s" transform="translate(459,18)">
<rect width="423" height="160" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="22" y="34" class="m" font-size="11" fill="#c2410c" font-weight="600" letter-spacing="1.4">02 · NUTRICIÓN</text>
<text x="22" y="64" class="s" font-size="22" fill="#1f2328" font-weight="700">Comer sin contar</text>
<text x="22" y="96" class="s" font-size="13.5" fill="#59636e">Escáner, búsqueda en 198.000 productos,</text>
<text x="22" y="118" class="s" font-size="13.5" fill="#59636e">favoritos y copiar la comida de ayer.</text>
<g transform="translate(311,24)"><rect width="90" height="112" rx="10" fill="#ffffff" stroke="#eaeef2"/>
<rect x="14.0" y="22" width="2" height="52" fill="#1f2328"/><rect x="18.2" y="22" width="1" height="52" fill="#1f2328"/><rect x="22.4" y="22" width="3" height="52" fill="#1f2328"/><rect x="26.6" y="22" width="1" height="52" fill="#1f2328"/><rect x="30.8" y="22" width="2" height="52" fill="#1f2328"/><rect x="35.0" y="22" width="1" height="52" fill="#1f2328"/><rect x="39.2" y="22" width="1" height="52" fill="#1f2328"/><rect x="43.4" y="22" width="3" height="52" fill="#1f2328"/><rect x="47.6" y="22" width="2" height="52" fill="#1f2328"/><rect x="51.8" y="22" width="1" height="52" fill="#1f2328"/><rect x="56.0" y="22" width="2" height="52" fill="#1f2328"/><rect x="60.2" y="22" width="3" height="52" fill="#1f2328"/><rect x="64.4" y="22" width="1" height="52" fill="#1f2328"/><rect x="68.6" y="22" width="2" height="52" fill="#1f2328"/><rect x="72.8" y="22" width="1" height="52" fill="#1f2328"/>
<rect x="10" y="22" width="70" height="2.5" rx="1" fill="#1a7f37" class="escanea"/>
<path d="M8,16 h10 M8,16 v10 M82,16 h-10 M82,16 v10 M8,80 h10 M8,80 v-10 M82,80 h-10 M82,80 v-10" stroke="#c2410c" stroke-width="2.4" fill="none" stroke-linecap="round"/>
<text x="45" y="102" class="m" font-size="10" fill="#59636e" text-anchor="middle">ESCÁNER</text></g>
</g><g class="sube" style="animation-delay:0.24s" transform="translate(18,182)">
<rect width="423" height="160" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="22" y="34" class="m" font-size="11" fill="#c2410c" font-weight="600" letter-spacing="1.4">03 · PROGRESO</text>
<text x="22" y="64" class="s" font-size="22" fill="#1f2328" font-weight="700">Lo que mejora</text>
<text x="22" y="96" class="s" font-size="13.5" fill="#59636e">Récords por ejercicio, mediciones,</text>
<text x="22" y="118" class="s" font-size="13.5" fill="#59636e">objetivos y logros que se desbloquean.</text>
<g transform="translate(311,24)"><rect width="90" height="112" rx="10" fill="#ffffff" stroke="#eaeef2"/>
<line x1="10" y1="84" x2="80" y2="84" stroke="#d0d7de"/><rect x="12" y="58" width="8" height="26" rx="2" fill="#2f6fd0" class="crece" style="animation-delay:0.00s"/><rect x="24" y="46" width="8" height="38" rx="2" fill="#2f6fd0" class="crece" style="animation-delay:0.12s"/><rect x="36" y="50" width="8" height="34" rx="2" fill="#2f6fd0" class="crece" style="animation-delay:0.24s"/><rect x="48" y="34" width="8" height="50" rx="2" fill="#2f6fd0" class="crece" style="animation-delay:0.36s"/><rect x="60" y="38" width="8" height="46" rx="2" fill="#2f6fd0" class="crece" style="animation-delay:0.48s"/><rect x="72" y="20" width="8" height="64" rx="2" fill="#c2410c" class="crece" style="animation-delay:0.60s"/>
<text x="76" y="16" class="m" font-size="9.5" fill="#c2410c" text-anchor="end" font-weight="700">RÉCORD</text>
<text x="45" y="102" class="m" font-size="10" fill="#59636e" text-anchor="middle">PROGRESO</text></g>
</g><g class="sube" style="animation-delay:0.36s" transform="translate(459,182)">
<rect width="423" height="160" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="22" y="34" class="m" font-size="11" fill="#c2410c" font-weight="600" letter-spacing="1.4">04 · AVISOS</text>
<text x="22" y="64" class="s" font-size="22" fill="#1f2328" font-weight="700">Te recuerda, no te agobia</text>
<text x="22" y="96" class="s" font-size="13.5" fill="#59636e">Diez recordatorios push en español</text>
<text x="22" y="118" class="s" font-size="13.5" fill="#59636e">e inglés, que activas o apagas por tipo.</text>
<g transform="translate(311,24)"><rect width="90" height="112" rx="10" fill="#ffffff" stroke="#eaeef2"/>
<g transform="translate(45,48)"><g class="campana">
<path d="M-18,12 C-18,-6 -14,-18 0,-20 C14,-18 18,-6 18,12 L23,18 L-23,18Z" fill="#c2410c"/>
<circle cy="24" r="5" fill="#c2410c"/></g>
<circle cx="18" cy="-18" r="7" fill="#1a7f37" class="pop"/></g>
<text x="45" y="102" class="m" font-size="10" fill="#59636e" text-anchor="middle">AVISOS</text></g>
</g>
</svg>