<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">GymProFit: entrena, come bien y mide tu progreso en una sola app. App Android, API REST en Spring Boot y panel web en React. Versión 1.6.5, en desarrollo activo.</title>
<style>
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}

.ecg{stroke-dasharray:300 600;animation:ecg 2.8s linear infinite}
@keyframes ecg{0%{stroke-dashoffset:300}100%{stroke-dashoffset:-600}}
.arco{animation:arco 1.4s cubic-bezier(.2,0,0,1) both}
@keyframes arco{from{stroke-dasharray:0 999}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.2s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{0%{transform:scale(1);opacity:.6}75%,100%{transform:scale(2.8);opacity:0}}
.sube{animation:sube .8s cubic-bezier(.05,.7,.1,1) both}
@keyframes sube{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.late{transform-box:fill-box;transform-origin:center;animation:late 1.4s ease-in-out infinite}
@keyframes late{0%,100%{transform:scale(1)}12%{transform:scale(1.12)}24%{transform:scale(1)}36%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.ecg,.arco,.ping,.sube,.late{animation:none}}
</style>
