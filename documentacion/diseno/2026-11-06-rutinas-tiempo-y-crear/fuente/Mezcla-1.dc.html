<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Crear rutina, mezcla, qué y cuánto</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700;800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=block" rel="stylesheet">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;display:inline-block;white-space:nowrap;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.ms.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: #0B0C0E; color: #F2F2F3; font-family: 'Barlow', sans-serif; display: flex; flex-direction: column">
<header style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 8px 0 4px; display: flex; align-items: center; gap: 4px">
<button type="button" aria-label="Cerrar" style="width: 48px; height: 48px; border: 0; padding: 0; border-radius: 24px; background: transparent; color: #F2F2F3; display: flex; align-items: center; justify-content: center; cursor: pointer"><span class="ms" aria-hidden="true">close</span></button>
<h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 22px; line-height: 28px">Nueva rutina</h1>
</header>
<main style="box-sizing: border-box; padding: 4px 20px 24px; display: flex; flex-direction: column; gap: 28px">

<section aria-labelledby="m1-zonas" style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 id="m1-zonas" style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; line-height: 34px">¿Qué quieres entrenar?</h2>
<p style="margin: 0; font-size: 14px; line-height: 18px; color: #A1A9B6">Elige una o varias zonas.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{ zonas }}" as="z" hint-placeholder-count="6">
<button type="button" aria-pressed="{{ z.marcada }}" style="height: 88px; box-sizing: border-box; padding: 12px 12px 12px 14px; border: 0; border-radius: 20px; background: {{ z.fondo }}; color: {{ z.color }}; text-align: left; display: flex; flex-direction: column; cursor: pointer">
<span style="width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 6px"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 24px; line-height: 28px">{{ z.nombre }}</span><span class="ms f" aria-hidden="true" style="font-size: 22px; opacity: {{ z.check }}">check_circle</span></span>
<span style="margin-top: auto; font-family: 'Barlow', sans-serif; font-size: 13px; line-height: 17px; color: {{ z.colorSub }}">{{ z.ejemplos }}</span>
</button>
</sc-for>
</div>
</section>

<section aria-labelledby="m1-tiempo" style="display: flex; flex-direction: column; gap: 12px">
<h2 id="m1-tiempo" style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; line-height: 28px">¿Cuánto tiempo tienes?</h2>
<div role="radiogroup" aria-labelledby="m1-tiempo" style="height: 52px; box-sizing: border-box; padding: 4px; border-radius: 26px; background: #252A31; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{ tiempos }}" as="t" hint-placeholder-count="4">
<button type="button" role="radio" aria-checked="{{ t.marcado }}" style="border: 0; border-radius: 22px; background: {{ t.fondo }}; color: {{ t.color }}; font-family: 'Barlow', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">{{ t.texto }}</button>
</sc-for>
</div>
<p style="margin: 0; font-size: 13px; line-height: 17px; color: #A1A9B6">Mientras eliges, te decimos cuánto te queda.</p>
</section>

<button type="button" style="align-self: flex-start; min-height: 44px; margin-top: -12px; padding: 0 8px; border: 0; background: transparent; color: #FF6A00; font-family: 'Barlow', sans-serif; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer"><span class="ms" aria-hidden="true">search</span>Prefiero buscar entre todos</button>
</main>
<footer style="margin-top: auto; flex-shrink: 0; box-sizing: border-box; padding: 12px 20px 20px; border-top: 1px solid #252A31; background: #0B0C0E; display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; font-size: 14px; line-height: 18px; color: #A1A9B6">Pecho y hombros, 45 minutos.</p>
<button type="button" style="height: 56px; border: 0; border-radius: 28px; background: #FF6A00; color: #1A0E00; font-family: 'Barlow', sans-serif; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">Elegir ejercicios<span class="ms" aria-hidden="true">arrow_forward</span></button>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const zona = (nombre, ejemplos, marcada) => ({
      nombre, ejemplos, marcada,
      check: marcada ? 1 : 0,
      fondo: marcada ? '#FF6A00' : '#1B1E24',
      color: marcada ? '#1A0E00' : '#F2F2F3',
      colorSub: marcada ? '#1A0E00' : '#A1A9B6'
    });
    const tiempo = (texto, marcado) => ({
      texto, marcado,
      fondo: marcado ? '#FF6A00' : 'transparent',
      color: marcado ? '#1A0E00' : '#F2F2F3'
    });
    return {
      zonas: [
        zona('Pecho', 'Press de banca y aperturas', true),
        zona('Espalda', 'Remo, jalón y dominadas', false),
        zona('Pierna', 'Sentadilla, prensa y zancadas', false),
        zona('Hombros', 'Press militar y elevaciones', true),
        zona('Brazos', 'Curl y extensión de tríceps', false),
        zona('Abdomen', 'Plancha y crunch en polea', false)
      ],
      tiempos: [tiempo('30 min', false), tiempo('45 min', true), tiempo('60 min', false), tiempo('75+ min', false)]
    };
  }
}
</script>
</body>
</html>
