<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Perfil, opción 1</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700;800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=block" rel="stylesheet">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;display:inline-block;white-space:nowrap;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.ms.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
</style>
</helmet>
<div style="width: 390px; height: 920px; overflow: hidden; box-sizing: border-box; background: #0B0C0E; color: #F2F2F3; font-family: 'Barlow', sans-serif; display: flex; flex-direction: column">
<header style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 8px 0 4px; display: flex; align-items: center; gap: 4px">
<button type="button" aria-label="Volver" style="width: 48px; height: 48px; border: 0; padding: 0; border-radius: 24px; background: transparent; color: #F2F2F3; display: flex; align-items: center; justify-content: center; cursor: pointer"><span class="ms" aria-hidden="true">arrow_back</span></button>
<h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 22px; line-height: 28px">Perfil</h1>
</header>
<main style="box-sizing: border-box; padding: 4px 20px 24px; display: flex; flex-direction: column; gap: 24px">

<div style="display: flex; align-items: center; gap: 16px">
<button type="button" aria-label="Cambiar foto" style="position: relative; width: 64px; height: 64px; flex-shrink: 0; padding: 0; border: 0; border-radius: 32px; background: #3A2110; color: #FFB27A; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; line-height: 64px; cursor: pointer">D<span aria-hidden="true" style="position: absolute; right: -4px; bottom: -4px; width: 28px; height: 28px; box-sizing: border-box; border: 3px solid #0B0C0E; border-radius: 14px; background: #252A31; color: #F2F2F3; display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 15px">photo_camera</span></span></button>
<div style="min-width: 0; display: flex; flex-direction: column; gap: 2px">
<p style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px; line-height: 32px">Dani</p>
<p style="margin: 0; font-size: 14px; line-height: 18px; color: #A1A9B6">@dani.entrena, desde septiembre</p>
</div>
</div>

<section aria-labelledby="o1-objetivo" style="box-sizing: border-box; padding: 20px; border-radius: 28px; background: #1B1E24; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 14px">
<span style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 16px; background: #3A2110; color: #FF6A00; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true" style="font-size: 30px">trending_down</span></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-size: 13px; line-height: 16px; font-weight: 600; color: #A1A9B6">Tu objetivo</span>
<h2 id="o1-objetivo" style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; line-height: 34px">Perder grasa</h2>
</div>
<button type="button" style="min-height: 48px; padding: 0 12px; margin-right: -8px; border: 0; border-radius: 24px; background: transparent; color: #FF6A00; font-family: 'Barlow', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">Cambiar</button>
</div>
<p style="margin: 0; font-size: 15px; line-height: 21px; color: #A1A9B6">Comes un poco menos de lo que gastas y mucha proteína, para que lo que bajes sea grasa y no músculo.</p>
<div style="height: 1px; background: #252A31"></div>
<p style="margin: 0; display: flex; align-items: baseline; gap: 8px"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 46px; line-height: 48px">2.150</span><span style="font-size: 16px; line-height: 20px; color: #A1A9B6">kcal al día</span></p>
<div role="img" aria-label="Reparto de las calorías: 30 % de proteína, 39 % de hidratos y 31 % de grasa" style="margin-top: -4px; height: 10px; display: flex; gap: 3px">
<sc-for list="{{ macros }}" as="m" hint-placeholder-count="3"><span style="flex: {{ m.peso }}; border-radius: 5px; background: {{ m.color }}"></span></sc-for>
</div>
<div style="margin-top: -6px; display: flex; gap: 3px">
<sc-for list="{{ macros }}" as="m" hint-placeholder-count="3">
<p style="margin: 0; flex: {{ m.peso }}; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 20px; line-height: 24px; color: {{ m.color }}">{{ m.gramos }}</span><span style="font-size: 13px; line-height: 16px; color: #A1A9B6">{{ m.nombre }}</span></p>
</sc-for>
</div>
</section>

<section aria-labelledby="o1-datos" style="box-sizing: border-box; padding: 8px 20px 20px; border-radius: 28px; background: #1B1E24; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<h2 id="o1-datos" style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; line-height: 28px">Tus datos</h2>
<button type="button" style="min-height: 48px; padding: 0 12px; margin-right: -12px; border: 0; border-radius: 24px; background: transparent; color: #FF6A00; font-family: 'Barlow', sans-serif; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer"><span class="ms" aria-hidden="true" style="font-size: 20px">edit</span>Editar</button>
</div>
<dl style="margin: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px 12px">
<sc-for list="{{ datos }}" as="d" hint-placeholder-count="5">
<div style="grid-column: span {{ d.ancho }}; min-width: 0; display: flex; flex-direction: column-reverse; gap: 2px"><dt style="font-size: 13px; line-height: 16px; color: #A1A9B6">{{ d.etiqueta }}</dt><dd style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 22px; line-height: 26px">{{ d.valor }}</dd></div>
</sc-for>
</dl>
</section>

<section aria-labelledby="o1-cuenta" style="display: flex; flex-direction: column; gap: 10px">
<h2 id="o1-cuenta" style="margin: 0 0 0 4px; font-size: 14px; line-height: 18px; font-weight: 600; color: #A1A9B6">Cuenta</h2>
<div style="border-radius: 24px; background: #1B1E24; overflow: hidden; display: flex; flex-direction: column">
<sc-for list="{{ cuenta }}" as="c" hint-placeholder-count="2">
<button type="button" style="min-height: 56px; box-sizing: border-box; padding: 0 12px 0 16px; border: 0; border-top: {{ c.borde }}; background: transparent; color: #F2F2F3; font-family: 'Barlow', sans-serif; font-size: 16px; text-align: left; display: flex; align-items: center; gap: 14px; cursor: pointer"><span class="ms" aria-hidden="true" style="color: #A1A9B6">{{ c.icono }}</span><span style="flex: 1">{{ c.texto }}</span><span class="ms" aria-hidden="true" style="color: #A1A9B6">chevron_right</span></button>
</sc-for>
</div>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":920}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      macros: [
        { peso: 30, color: '#6BA6F5', gramos: '160 g', nombre: 'de proteína' },
        { peso: 39, color: '#E8A94B', gramos: '210 g', nombre: 'de hidratos' },
        { peso: 31, color: '#B295E8', gramos: '74 g', nombre: 'de grasa' }
      ],
      datos: [
        { valor: '78 kg', etiqueta: 'Peso', ancho: 2 },
        { valor: '178 cm', etiqueta: 'Altura', ancho: 2 },
        { valor: '24 años', etiqueta: 'Edad', ancho: 2 },
        { valor: 'Intermedio', etiqueta: 'Nivel', ancho: 3 },
        { valor: 'Moderada', etiqueta: 'Actividad', ancho: 3 }
      ],
      cuenta: [
        { icono: 'mail', texto: 'Correo', borde: '0' },
        { icono: 'lock', texto: 'Contraseña', borde: '1px solid #252A31' }
      ]
    };
  }
}
</script>
</body>
</html>
