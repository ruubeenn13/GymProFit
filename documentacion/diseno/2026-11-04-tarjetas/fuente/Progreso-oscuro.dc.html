<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Progreso, historial</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=block" rel="stylesheet">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;display:inline-block;white-space:nowrap;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.ms.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
@keyframes gp-crece{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes gp-brilla{0%,100%{filter:none}40%{filter:brightness(1.45)}}
@media (prefers-reduced-motion: reduce){.gp-barra{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 270px; overflow: hidden; box-sizing: border-box; padding: 24px 20px; background: #0B0C0E; color: #F2F2F3; font-family: 'Barlow', sans-serif; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between; margin-right: -8px">
<h2 style="margin: 0; font-size: 20px; font-weight: 600; color: #F2F2F3">Historial</h2>
<a href="Historial-oscuro.dc.html" style="min-height: 48px; padding: 0 8px; display: flex; align-items: center; font-size: 15px; font-weight: 600; color: #FF6A00; text-decoration: none">Ver todo</a>
</div>
<div style="box-sizing: border-box; padding: 4px 0; border-radius: 24px; background: #1B1E24; display: flex; flex-direction: column">
<sc-for list="{{ filas }}" as="f" hint-placeholder-count="2">
<sc-if value="{{ f.raya }}" hint-placeholder-val="{{ false }}">
<div style="height: 1px; margin-left: 16px; background: #252A31"></div>
</sc-if>
<a href="#" aria-label="{{ f.a11y }}" style="min-height: 72px; box-sizing: border-box; padding: 10px 12px 10px 16px; color: #F2F2F3; text-decoration: none; display: flex; align-items: center; gap: 12px">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 600">{{ f.rutina }}</span><span style="font-size: 13px; color: #A1A9B6">{{ f.apoyo }}<sc-if value="{{ f.rec }}" hint-placeholder-val="{{ false }}"><span style="font-weight: 600; color: #E8B84B">{{ f.rec }}</span></sc-if></span></span>
<dc-import name="Barras" datos="{{ f.barras }}" tema="oscuro" alto="24" ancho="5" hueco="3" hint-size="45px,24px"></dc-import>
<span class="ms" aria-hidden="true" style="color: #A1A9B6">chevron_right</span>
</a>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":270}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      filas: [
        { raya: false, rutina: 'Pierna A', apoyo: 'Ayer, 13.640 kg y ', rec: '1 récord',
          barras: [[11020, 0], [11640, 1], [12180, 0], [12740, 0], [13250, 0], [13640, 1]],
          a11y: 'Pierna A, ayer. 13.640 kilos y 1 récord. Tus 6 últimas veces, de 11.020 a 13.640 kilos. Abre el resumen.' },
        { raya: true, rutina: 'Torso A', apoyo: 'Lunes, 8.410 kg', rec: null,
          barras: [[7380, 0], [7610, 1], [7790, 0], [8010, 1], [8250, 0], [8410, 0]],
          a11y: 'Torso A, el lunes. 8.410 kilos. Tus 6 últimas veces, de 7.380 a 8.410 kilos. Abre el resumen.' }
      ]
    };
  }
}
</script>
</body>
</html>
