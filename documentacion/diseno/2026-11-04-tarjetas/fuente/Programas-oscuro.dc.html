<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Programas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=block" rel="stylesheet">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;display:inline-block;white-space:nowrap;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.ms.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
</style>
</helmet>
<div style="width: 390px; height: 1120px; overflow: hidden; background: #0B0C0E; color: #F2F2F3; font-family: 'Barlow', sans-serif; display: flex; flex-direction: column">
<header style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 4px; background: #1B1E24; display: flex; align-items: center; gap: 4px">
<button type="button" aria-label="Volver" style="width: 48px; height: 48px; padding: 0; border: 0; border-radius: 24px; background: transparent; color: #F2F2F3; display: flex; align-items: center; justify-content: center; cursor: pointer"><span class="ms" aria-hidden="true">arrow_back</span></button>
<h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 20px; color: #F2F2F3">Programas</h1>
</header>
<main style="box-sizing: border-box; padding: 20px 20px 24px; display: flex; flex-direction: column">
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 13px; line-height: 16px; letter-spacing: 0.08em; color: #A1A9B6">DÓNDE ENTRENAS</span>
<div style="margin-top: 12px; display: flex; gap: 8px">
<span style="height: 40px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; border: 1px solid #676F7E; background: #3A2110; color: #FFB27A; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600"><span class="ms" aria-hidden="true" style="font-size: 18px; color: #FF6A00">check</span>Gimnasio</span>
<span style="height: 40px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; border: 1px solid #676F7E; background: #252A31; color: #F2F2F3; display: inline-flex; align-items: center; font-size: 14px">Mancuernas</span>
<span style="height: 40px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; border: 1px solid #676F7E; background: #252A31; color: #F2F2F3; display: inline-flex; align-items: center; font-size: 14px">Peso corporal</span>
</div>
<span style="margin-top: 20px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 13px; line-height: 16px; letter-spacing: 0.08em; color: #A1A9B6">DÍAS POR SEMANA</span>
<div style="margin-top: 12px; display: flex; gap: 8px">
<span style="width: 48px; height: 40px; box-sizing: border-box; border-radius: 12px; border: 1px solid #676F7E; background: #252A31; color: #F2F2F3; display: inline-flex; align-items: center; justify-content: center; font-size: 14px">2</span>
<span style="height: 40px; box-sizing: border-box; padding: 0 10px; border-radius: 12px; border: 1px solid #676F7E; background: #3A2110; color: #FFB27A; display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600"><span class="ms" aria-hidden="true" style="font-size: 18px; color: #FF6A00">check</span>3</span>
<span style="width: 48px; height: 40px; box-sizing: border-box; border-radius: 12px; border: 1px solid #676F7E; background: #252A31; color: #F2F2F3; display: inline-flex; align-items: center; justify-content: center; font-size: 14px">4</span>
<span style="width: 48px; height: 40px; box-sizing: border-box; border-radius: 12px; border: 1px solid #676F7E; background: #252A31; color: #F2F2F3; display: inline-flex; align-items: center; justify-content: center; font-size: 14px">5</span>
<span style="width: 48px; height: 40px; box-sizing: border-box; border-radius: 12px; border: 1px solid #676F7E; background: #252A31; color: #F2F2F3; display: inline-flex; align-items: center; justify-content: center; font-size: 14px">6</span>
</div>
<span style="margin-top: 28px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 13px; line-height: 16px; letter-spacing: 0.08em; color: #FF6A00">PARA TI · NIVEL INTERMEDIO</span>
<a href="#" aria-label="Cuerpo completo, recomendado para ti. Intermedio, 2 o 3 días, 50 minutos. Ciclo de 3 rutinas que se repite: Cuerpo completo A, B y C." style="margin-top: 12px; box-sizing: border-box; padding: 20px; border-radius: 28px; background: #3A2110; color: #FFF4E8; text-decoration: none; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: flex-start; gap: 8px">
<div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; line-height: 29px; color: #FFF4E8">Cuerpo completo</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #FFD3B0"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: #E8A94B"></span>Intermedio, 2 o 3 días, 50 minutos</span>
</div>
<span class="ms" aria-hidden="true" style="color: #FFD3B0">chevron_right</span>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<span style="width: 36px; height: 36px; box-sizing: border-box; border-radius: 18px; border: 1px solid #FFD3B0; color: #FFF4E8; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 14px">CA</span>
<span style="width: 36px; height: 36px; box-sizing: border-box; border-radius: 18px; border: 1px solid #FFD3B0; color: #FFF4E8; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 14px">CB</span>
<span style="width: 36px; height: 36px; box-sizing: border-box; border-radius: 18px; border: 1px solid #FFD3B0; color: #FFF4E8; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 14px">CC</span>
<span class="ms" aria-hidden="true" style="font-size: 20px; color: #FFD3B0">autorenew</span>
</div>
</a>
<span style="margin-top: 28px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 13px; line-height: 16px; letter-spacing: 0.08em; color: #A1A9B6">MÁS PROGRAMAS</span>
<div style="margin-top: 12px; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{ programas }}" as="p" hint-placeholder-count="4">
<a href="#" aria-label="{{ p.a11y }}" style="box-sizing: border-box; padding: 16px; border-radius: 24px; background: #1B1E24; color: #F2F2F3; text-decoration: none; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: flex-start; gap: 8px">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="display: flex; align-items: center; flex-wrap: wrap; gap: 8px"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; line-height: 26px; color: #F2F2F3">{{ p.nombre }}</span><sc-if value="{{ p.loSigues }}" hint-placeholder-val="{{ false }}"><span style="height: 22px; padding: 0 8px; border-radius: 11px; background: #3A2110; color: #FFB27A; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center">Lo sigues</span></sc-if></span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #A1A9B6"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: {{ p.colorNivel }}"></span>{{ p.meta }}</span>
</div>
<span class="ms" aria-hidden="true" style="color: #A1A9B6">chevron_right</span>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<sc-for list="{{ p.ciclo }}" as="c" hint-placeholder-count="4">
<span style="width: 36px; height: 36px; border-radius: 18px; background: #252A31; color: #F2F2F3; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 14px">{{ c }}</span>
</sc-for>
<span class="ms" aria-hidden="true" style="font-size: 20px; color: #A1A9B6">autorenew</span>
</div>
</a>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1120}}'>
class Component extends DCLogic {
  renderVals() {
    const p = (nombre, meta, colorNivel, ciclo, loSigues, a11yCiclo) => ({
      nombre, meta, colorNivel, ciclo, loSigues,
      a11y: nombre + (loSigues ? ', lo sigues' : '') + '. ' + meta + '. Ciclo de ' + ciclo.length + ' rutinas que se repite: ' + a11yCiclo + '.'
    });
    return {
      programas: [
        p('Para empezar', 'Principiante, 2 o 3 días, de 45 a 55 minutos', '#4ADE80', ['PA', 'PB'], false, 'Para empezar A y B'),
        p('Torso y pierna', 'Intermedio, 4 días, de 50 a 55 minutos', '#E8A94B', ['TA', 'PA', 'TB', 'PB'], true, 'Torso A, Pierna A, Torso B y Pierna B'),
        p('Torso y pierna + empuje y tirón', 'Intermedio, 5 días, de 50 a 55 minutos', '#E8A94B', ['TA', 'PA', 'EM', 'TI', 'PB'], false, 'Torso A, Pierna A, Empuje, Tirón y Pierna B'),
        p('Empuje, tirón y pierna', 'Intermedio, 6 días, de 50 a 55 minutos', '#E8A94B', ['EM', 'TI', 'PA', 'EM', 'TI', 'PB'], false, 'Empuje, Tirón, Pierna A, Empuje, Tirón y Pierna B')
      ]
    };
  }
}
</script>
</body>
</html>
