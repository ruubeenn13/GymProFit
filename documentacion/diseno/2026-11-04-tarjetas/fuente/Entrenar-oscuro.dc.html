<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Entrenar, rutinas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=block" rel="stylesheet">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;display:inline-block;white-space:nowrap;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.ms.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
@keyframes gp-crece{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes gp-brilla{0%,100%{filter:none}40%{filter:brightness(1.45)}}
@media (prefers-reduced-motion: reduce){.gp-barra{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 1170px; overflow: hidden; box-sizing: border-box; padding: 24px 20px; background: #0B0C0E; color: #F2F2F3; font-family: 'Barlow', sans-serif; display: flex; flex-direction: column; gap: 36px">
<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 20px; font-weight: 600; color: #F2F2F3">Rutinas del programa</h2>
<div style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{ programa }}" as="r" hint-placeholder-count="4">
<a href="#" aria-label="{{ r.a11y }}" style="box-sizing: border-box; padding: 16px; border-radius: 24px; background: #1B1E24; color: #F2F2F3; text-decoration: none; display: flex; flex-direction: column">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 20px; line-height: 23px">{{ r.nombre }}</span><span style="font-size: 13px; font-weight: 600; color: {{ r.colorCuando }}; white-space: nowrap">{{ r.cuando }}</span></div>
<span style="margin-top: 2px; font-size: 13px; line-height: 16px; color: #A1A9B6">{{ r.zonas }}</span>
<span style="margin-top: 2px; font-size: 13px; line-height: 16px; color: #A1A9B6">{{ r.pauta }}</span>
<div style="margin-top: 10px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; line-height: 30px">{{ r.kg }}<span style="font-family: 'Barlow', sans-serif; font-weight: 400; font-size: 15px; color: #A1A9B6"> kg</span></span><dc-import name="Barras" datos="{{ r.barras }}" tema="oscuro" alto="36" ancho="10" hueco="6" hint-size="90px,36px"></dc-import></div>
<span style="margin-top: 6px; font-size: 13px; line-height: 16px; color: #A1A9B6">{{ r.ultima }}<sc-if value="{{ r.rec }}" hint-placeholder-val="{{ false }}"><span style="font-weight: 600; color: #E8B84B">{{ r.rec }}</span></sc-if></span>
</a>
</sc-for>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 20px; font-weight: 600; color: #F2F2F3">Mis rutinas</h2>
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="box-sizing: border-box; padding: 12px 12px 16px 16px; border-radius: 24px; background: #1B1E24; color: #F2F2F3; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px"><a href="#" style="color: #F2F2F3; text-decoration: none; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 20px; line-height: 23px">Día de brazos</a><button type="button" aria-label="Empezar Día de brazos" style="width: 48px; height: 48px; flex-shrink: 0; padding: 0; border: 0; border-radius: 24px; background: #252A31; color: #FF6A00; display: flex; align-items: center; justify-content: center; cursor: pointer"><span class="ms f" aria-hidden="true">play_arrow</span></button></div>
<span style="font-size: 13px; line-height: 16px; color: #A1A9B6">Brazos y abdomen</span>
<span style="margin-top: 2px; font-size: 13px; line-height: 16px; color: #A1A9B6">5 ejercicios y 35 minutos</span>
<div style="margin-top: 10px; margin-right: 4px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; line-height: 30px">2.280<span style="font-family: 'Barlow', sans-serif; font-weight: 400; font-size: 15px; color: #A1A9B6"> kg</span></span><dc-import name="Barras" datos="{{ brazos }}" tema="oscuro" alto="36" ancho="10" hueco="6" hint-size="26px,36px"></dc-import></div>
<span style="margin-top: 6px; font-size: 13px; line-height: 16px; color: #A1A9B6">La última vez, hace 3 semanas</span>
</div>
<div style="box-sizing: border-box; padding: 12px 12px 16px 16px; border-radius: 24px; background: #1B1E24; color: #F2F2F3; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px"><a href="#" style="color: #F2F2F3; text-decoration: none; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 20px; line-height: 23px">Pierna en casa</a><button type="button" aria-label="Empezar Pierna en casa" style="width: 48px; height: 48px; flex-shrink: 0; padding: 0; border: 0; border-radius: 24px; background: #252A31; color: #FF6A00; display: flex; align-items: center; justify-content: center; cursor: pointer"><span class="ms f" aria-hidden="true">play_arrow</span></button></div>
<span style="font-size: 13px; line-height: 16px; color: #A1A9B6">Pierna</span>
<span style="margin-top: 2px; font-size: 13px; line-height: 16px; color: #A1A9B6">5 ejercicios y 40 minutos</span>
<span style="margin-top: 10px; font-size: 16px; line-height: 20px; color: #A1A9B6">Sin hacer todavía</span>
</div>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1170}}'>
class Component extends DCLogic {
  renderVals() {
    const r = (nombre, cuando, hoy, zonas, pauta, kg, barras, ultima, rec) => ({
      nombre, cuando, zonas, pauta, kg, barras, ultima, rec,
      colorCuando: hoy ? '#FF6A00' : '#A1A9B6',
      a11y: nombre + ', ' + cuando.toLowerCase() + '. ' + zonas + '. ' + pauta + '. La última vez, ' + kg + ' kilos' + (rec ? ' y ' + rec : '') + '.'
    });
    return {
      programa: [
        r('Torso B', 'Hoy', true, 'Pecho, espalda y brazos', '7 ejercicios y 55 minutos', '7.920',
          [[6980, 0], [7150, 0], [7320, 0], [7540, 0], [7920, 1]], 'La última vez, hace 6 días, con ', '2 récords'),
        r('Pierna B', 'Siguiente', false, 'Pierna y abdomen', '6 ejercicios y 50 minutos', '11.980',
          [[10890, 0], [11450, 0], [11900, 1], [12230, 0], [11980, 0]], 'La última vez, hace 5 días', null),
        r('Torso A', 'En 2 entrenos', false, 'Espalda, hombros y brazos', '7 ejercicios y 55 minutos', '8.410',
          [[7380, 0], [7610, 1], [7790, 0], [8010, 1], [8250, 0], [8410, 0]], 'La última vez, hace 2 días', null),
        r('Pierna A', 'En 3 entrenos', false, 'Pierna y abdomen', '6 ejercicios y 50 minutos', '13.640',
          [[11020, 0], [11640, 1], [12180, 0], [12740, 0], [13250, 0], [13640, 1]], 'La última vez, ayer, con ', '1 récord')
      ],
      brazos: [[2150, 0], [2280, 0]]
    };
  }
}
</script>
</body>
</html>
