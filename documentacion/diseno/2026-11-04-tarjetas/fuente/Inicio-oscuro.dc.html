<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Inicio, tus últimos entrenos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=block" rel="stylesheet">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;display:inline-block;white-space:nowrap;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.ms.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
@keyframes gp-crece{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes gp-brilla{0%,100%{filter:none}40%{filter:brightness(1.45)}}
@media (prefers-reduced-motion: reduce){.gp-barra{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 260px; overflow: hidden; box-sizing: border-box; padding: 24px 0; background: #0B0C0E; color: #F2F2F3; font-family: 'Barlow', sans-serif; display: flex; flex-direction: column; gap: 14px">
<div style="box-sizing: border-box; padding: 0 12px 0 20px; display: flex; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-size: 20px; font-weight: 600; color: #F2F2F3">Tus últimos entrenos</h2>
<a href="Historial-oscuro.dc.html" style="min-height: 48px; padding: 0 8px; display: flex; align-items: center; font-size: 15px; font-weight: 600; color: #FF6A00; text-decoration: none">Historial</a>
</div>
<div style="overflow: hidden">
<div style="box-sizing: border-box; padding: 0 20px; display: flex; gap: 12px; width: max-content">
<sc-for list="{{ entrenos }}" as="e" hint-placeholder-count="2">
<a href="#" aria-label="{{ e.a11y }}" style="box-sizing: border-box; width: 220px; padding: 16px; border-radius: 20px; background: #1B1E24; color: #F2F2F3; text-decoration: none; display: flex; flex-direction: column">
<span style="font-size: 13px; line-height: 16px; color: #A1A9B6">{{ e.cuando }}</span>
<span style="margin-top: 6px; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 20px; line-height: 23px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ e.rutina }}</span>
<div style="margin-top: 8px; display: flex; align-items: flex-end; justify-content: space-between; gap: 8px"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; line-height: 30px">{{ e.kg }}<span style="font-family: 'Barlow', sans-serif; font-weight: 400; font-size: 14px; color: #A1A9B6"> kg</span></span><dc-import name="Barras" datos="{{ e.barras }}" tema="oscuro" alto="28" ancho="7" hueco="4" hint-size="62px,28px"></dc-import></div>
<span style="margin-top: 8px; display: inline-flex; align-items: center; gap: 4px; font-size: 14px; line-height: 18px; font-weight: 600; color: {{ e.color }}"><span class="ms" aria-hidden="true" style="font-size: 18px; font-variation-settings: {{ e.relleno }}">{{ e.icono }}</span>{{ e.destaca }}</span>
</a>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":260}}'>
class Component extends DCLogic {
  renderVals() {
    const lleno = "'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24";
    const vacio = "'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24";
    const oro = (t) => ({ destaca: t, icono: 'trophy', color: '#E8B84B', relleno: lleno });
    const sube = (t) => ({ destaca: t, icono: 'trending_up', color: '#4ADE80', relleno: vacio });
    const baja = (t) => ({ destaca: t, icono: 'trending_down', color: '#A1A9B6', relleno: vacio });
    const e = (rutina, cuando, kg, barras, d, a11y) => Object.assign({ rutina, cuando, kg, barras, a11y }, d);
    return {
      entrenos: [
        e('Pierna A', 'Ayer, martes', '13.640', [[11020, 0], [11640, 1], [12180, 0], [12740, 0], [13250, 0], [13640, 1]], oro('1 récord'),
          'Pierna A, ayer. 13.640 kilos y 1 récord. Tus 6 últimas veces, de 11.020 a 13.640 kilos.'),
        e('Torso A', 'Lunes', '8.410', [[7380, 0], [7610, 1], [7790, 0], [8010, 1], [8250, 0], [8410, 0]], sube('2 % más que la anterior'),
          'Torso A, el lunes. 8.410 kilos, 2 % más que la anterior.'),
        e('Pierna B', 'Viernes', '11.980', [[10890, 0], [11450, 0], [11900, 1], [12230, 0], [11980, 0]], baja('2 % menos que la anterior'),
          'Pierna B, el viernes. 11.980 kilos, 2 % menos que la anterior.'),
        e('Torso B', 'Jueves', '7.920', [[6980, 0], [7150, 0], [7320, 0], [7540, 0], [7920, 1]], oro('2 récords'),
          'Torso B, el jueves. 7.920 kilos y 2 récords.'),
        e('Pierna A', 'Martes pasado', '13.250', [[11020, 0], [11640, 1], [12180, 0], [12740, 0], [13250, 0]], sube('4 % más que la anterior'),
          'Pierna A, el martes pasado. 13.250 kilos, 4 % más que la anterior.')
      ]
    };
  }
}
</script>
</body>
</html>
