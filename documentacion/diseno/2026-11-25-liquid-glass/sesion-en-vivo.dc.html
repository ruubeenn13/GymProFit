<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Liquid Glass · Sesión en vivo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Condensed:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FF8A3D}a:hover{color:#FFB27A}
.g{background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.05) 55%,rgba(255,255,255,.09));backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 12px 32px rgba(0,0,0,.35)}
.c{font-family:'Barlow Condensed',sans-serif}
button{font-family:inherit;cursor:pointer}
.r{display:grid;grid-template-columns:44px minmax(0,1fr) 64px 52px 36px;align-items:center;height:48px;padding:0 10px;font-size:15px}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#08090B;font-family:Barlow,sans-serif;color:#F2F2F3">
  <div aria-hidden="true" style="position:absolute;inset:0;background:radial-gradient(380px 300px at 100% 0%,rgba(255,106,0,.5),transparent 70%),radial-gradient(340px 300px at 0% 60%,rgba(232,184,75,.28),transparent 70%),radial-gradient(360px 300px at 90% 95%,rgba(60,90,200,.4),transparent 70%)"></div>

  <div style="position:relative;padding:54px 16px 0;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <button class="g" aria-label="Minimizar" style="width:44px;height:44px;border-radius:22px;color:#F2F2F3;padding:0;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="c" style="font-size:22px;font-weight:700">Torso A</div>
      <button class="g" style="height:44px;border-radius:22px;padding:0 18px;color:#FFB27A;font-size:15px;font-weight:600">Terminar</button>
    </div>

    <div class="g" style="border-radius:24px;padding:14px 8px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));text-align:center">
      <div><div style="font-size:12px;color:#C9CDD6">Tiempo</div><div class="c" style="font-size:30px;font-weight:800">32:14</div></div>
      <div style="border-left:1px solid rgba(255,255,255,.14);border-right:1px solid rgba(255,255,255,.14)"><div style="font-size:12px;color:#C9CDD6">Volumen</div><div class="c" style="font-size:30px;font-weight:800">4.820<span style="font-size:16px;color:#C9CDD6"> kg</span></div></div>
      <div><div style="font-size:12px;color:#C9CDD6">Series</div><div class="c" style="font-size:30px;font-weight:800">9<span style="font-size:16px;color:#C9CDD6"> de 18</span></div></div>
    </div>

    <section class="g" style="border-radius:28px;padding:16px 6px 10px">
      <div style="padding:0 12px 8px">
        <div class="c" style="font-size:28px;font-weight:800">Press de banca</div>
        <div style="font-size:13px;color:#C9CDD6">La última vez, 80 × 8 · Tu récord: 82,5 × 6</div>
      </div>
      <div class="r" style="font-size:12px;color:#A9AFBA;height:30px"><span>Serie</span><span>Anterior</span><span>kg</span><span>Reps</span><span></span></div>
      <div class="r"><span class="c" style="font-weight:700">1</span><span style="color:#C9CDD6">80 × 8</span><span class="c" style="font-size:20px;font-weight:700">80</span><span class="c" style="font-size:20px;font-weight:700">8</span><span style="color:#8FE3B0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-label="Hecha" role="img"><path d="m5 12 5 5 9-10"/></svg></span></div>
      <div class="r"><span class="c" style="font-weight:700">2</span><span style="color:#C9CDD6">80 × 8</span><span class="c" style="font-size:20px;font-weight:700">82,5</span><span class="c" style="font-size:20px;font-weight:700">7</span><span style="color:#8FE3B0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-label="Hecha" role="img"><path d="m5 12 5 5 9-10"/></svg></span></div>
      <div class="r" style="border-radius:16px;background:linear-gradient(90deg,rgba(232,184,75,.28),rgba(232,184,75,.08));box-shadow:inset 0 1px 0 rgba(255,236,190,.4);margin:2px 4px"><span class="c" style="font-weight:700;color:#E8B84B">3</span><span style="color:#F0DDA8;font-weight:600">¡Récord!</span><span class="c" style="font-size:20px;font-weight:700">85</span><span class="c" style="font-size:20px;font-weight:700">6</span><span style="color:#E8B84B"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-label="Récord" role="img"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/></svg></span></div>
      <div class="r" style="border-radius:16px;margin:4px 4px 0;background:rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 0 14px rgba(255,255,255,.06)"><span class="c" style="font-weight:700;color:#FFB27A">4</span><span style="color:#C9CDD6">80 × 7</span><span class="c" style="font-size:20px;font-weight:700;color:#FFB27A">85</span><span class="c" style="font-size:20px;font-weight:700;color:#C9CDD6">—</span><span style="width:26px;height:26px;border-radius:13px;border:2px solid rgba(255,255,255,.5)"></span></div>
      <button style="margin:10px 12px 2px;height:40px;border-radius:20px;border:1px dashed rgba(255,255,255,.3);background:transparent;color:#E4E6EB;font-size:14px;width:calc(100% - 24px)">Añadir serie</button>
    </section>

    <div class="g" style="border-radius:22px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;opacity:.85">
      <div><div style="font-size:12px;color:#C9CDD6">Después</div><div class="c" style="font-size:20px;font-weight:700">Remo con barra · 4 series</div></div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
    </div>
  </div>

  <div class="g" role="timer" aria-label="Descanso, quedan 1 minuto 24 segundos" style="position:absolute;left:12px;right:12px;bottom:22px;border-radius:30px;padding:14px 16px;background:linear-gradient(160deg,rgba(40,42,48,.6),rgba(20,22,26,.45))">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div>
        <div style="font-size:12px;color:#C9CDD6">Descanso</div>
        <div class="c" style="font-size:40px;font-weight:800;line-height:1">1:24</div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="g" style="width:52px;height:44px;border-radius:22px;color:#F2F2F3;font-size:14px;font-weight:600">−15</button>
        <button class="g" style="width:52px;height:44px;border-radius:22px;color:#F2F2F3;font-size:14px;font-weight:600">+15</button>
        <button style="height:44px;border-radius:22px;border:0;padding:0 16px;background:#FF6A00;color:#1A0E00;font-size:14px;font-weight:600">Saltar</button>
      </div>
    </div>
    <div style="height:6px;border-radius:3px;background:rgba(255,255,255,.14);margin-top:10px"><div style="width:47%;height:6px;border-radius:3px;background:linear-gradient(90deg,#FFB27A,#FF6A00)"></div></div>
    <div style="font-size:13px;color:#D5D8DF;margin-top:8px">Siguiente: serie 4 · 85 kg</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
