<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 16px; font-weight: 600;">Moderado</span><span style="font-size: 14px; line-height: 1.35; color: #C9CED6;">Ejercicio 3–5 días por semana</span></span>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 'moderado' };
  }
  renderVals() {
    const sel = this.state.sel;
    const op = (id) => {
      const si = sel === id;
      return {
        sel: si,
        fondo: si ? '#2A1B0F' : '#121418',
        borde: si ? '#FF6A00' : '#121418',
        aro: si ? '#FF6A00' : '#6F7784',
        marca: si ? '#FF6A00' : 'transparent',
        pick: () => this.setState({ sel: id })
      };
    };
    return {
      sedentario: op('sedentario'),
      ligero: op('ligero'),
      moderado: op('moderado'),
      activo: op('activo')
    };
  }
}
</script>
