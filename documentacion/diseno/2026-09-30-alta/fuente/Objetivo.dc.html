<style>
body{margin:0;background:#0B0C0E;font-family:'Barlow',sans-serif;color:#F2F2F3}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}

button,input{font-family:inherit}
button{cursor:pointer}
a{color:#FF6A00}a:hover{color:#FFB27A}
.toque:active{transform:scale(.97)}
@keyframes entra{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.18);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes rebote{0%{transform:scale(.6) rotate(-14deg)}60%{transform:scale(1.18) rotate(5deg)}100%{transform:scale(1) rotate(0)}}

@keyframes llena0{from{width:0}}

<span aria-hidden="true" class="anim" style="flex-shrink: 0; width: 28px; height: 28px; border-radius: 14px; border: 2px solid {{ musculo.aro }}; background: {{ musculo.marca }}; display: flex; align-items: center; justify-content: center; box-sizing: border-box; transition: background-color 150ms ease-out, border-color 150ms ease-out;"><sc-if value="{{ musculo.sel }}" hint-placeholder-val="{{ false }}"><span class="ms f anim" style="font-size: 18px; color: #1A0E00; animation: pop 260ms cubic-bezier(.34,1.56,.64,1);">check</span></sc-if></span>

<span aria-hidden="true" class="anim" style="flex-shrink: 0; width: 28px; height: 28px; border-radius: 14px; border: 2px solid {{ mantener.aro }}; background: {{ mantener.marca }}; display: flex; align-items: center; justify-content: center; box-sizing: border-box; transition: background-color 150ms ease-out, border-color 150ms ease-out;"><sc-if value="{{ mantener.sel }}" hint-placeholder-val="{{ false }}"><span class="ms f anim" style="font-size: 18px; color: #1A0E00; animation: pop 260ms cubic-bezier(.34,1.56,.64,1);">check</span></sc-if></span>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: null };
  }
  renderVals() {
    const sel = this.state.sel;
    const op = (id) => {
      const si = sel === id;
      return {
        sel: si,
        noSel: !si,
        fondo: si ? '#2A1B0F' : '#1B1E24',
        borde: si ? '#FF6A00' : '#1B1E24',
        aro: si ? '#FF6A00' : '#6F7784',
        marca: si ? '#FF6A00' : 'transparent',
        icoFondo: si ? '#FF6A00' : '#252A31',
        icoColor: si ? '#1A0E00' : '#FFB27A',
        pick: () => this.setState({ sel: id })
      };
    };
    return {
      perder: op('perder'),
      musculo: op('musculo'),
      mantener: op('mantener'),
      fuerza: op('fuerza'),
      hay: sel !== null,
      noHay: sel === null
    };
  }
}
</script>
