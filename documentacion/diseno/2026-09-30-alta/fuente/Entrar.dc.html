<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Entrar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=block">
<style>
body{margin:0;background:#0B0C0E;font-family:'Barlow',sans-serif;color:#F2F2F3}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
button,input{font-family:inherit}
button{cursor:pointer}
input::placeholder{color:#6F7784}
a{color:#FF6A00}a:hover{color:#FFB27A}
.toque:active{transform:scale(.97)}
@keyframes entra{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.anim{animation:none !important;transition:none !important}.toque:active{transform:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0C0E; color: #F2F2F3; font-family: 'Barlow', sans-serif; display: flex; flex-direction: column;">
<header style="display: flex; align-items: center; padding: 8px 20px 0 4px;">
<a href="Main.dc.html" aria-label="Atrás" class="toque" style="flex-shrink: 0; width: 48px; height: 48px; border-radius: 24px; color: #F2F2F3; display: flex; align-items: center; justify-content: center; text-decoration: none; transition: transform 120ms cubic-bezier(.2,0,0,1);"><span class="ms" aria-hidden="true">arrow_back</span></a>
</header>
<div style="padding: 12px 20px 0; display: flex; flex-direction: column; gap: 8px;">
<h1 class="anim" style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 38px; line-height: 1.05; animation: entra 350ms cubic-bezier(.05,.7,.1,1) backwards;">Entrar</h1>
<p class="anim" style="margin: 0; font-size: 16px; line-height: 1.45; color: #C9CED6; animation: entra 350ms cubic-bezier(.05,.7,.1,1) 50ms backwards;">Con tu correo o con tu nombre de usuario.</p>
</div>
<div style="padding: 24px 16px 0; display: flex; flex-direction: column; gap: 14px;">
<button type="button" class="anim toque" style="height: 52px; border: 1px solid #4A505B; border-radius: 26px; background: transparent; color: #F2F2F3; font-size: 16px; font-weight: 600; transition: transform 120ms cubic-bezier(.2,0,0,1); animation: entra 350ms cubic-bezier(.05,.7,.1,1) 100ms backwards;">Continuar con Google</button>
<div aria-hidden="true" class="anim" style="display: flex; align-items: center; gap: 12px; color: #A1A9B6; font-size: 14px; animation: entra 350ms cubic-bezier(.05,.7,.1,1) 140ms backwards;"><span style="flex-grow: 1; height: 1px; background: #252A31;"></span>o<span style="flex-grow: 1; height: 1px; background: #252A31;"></span></div>
<div class="anim" style="display: flex; flex-direction: column; gap: 6px; animation: entra 350ms cubic-bezier(.05,.7,.1,1) 180ms backwards;">
<label for="usuario" style="font-size: 14px; font-weight: 600; color: #C9CED6; padding: 0 4px;">Correo o usuario</label>
<input id="usuario" type="text" autocomplete="username" placeholder="lucia@example.com" style="height: 52px; padding: 0 16px; border-radius: 14px; border: 1px solid #4A505B; background: #121418; color: #F2F2F3; font-size: 16px; box-sizing: border-box;">
</div>
<div class="anim" style="display: flex; flex-direction: column; gap: 6px; animation: entra 350ms cubic-bezier(.05,.7,.1,1) 220ms backwards;">
<label for="clave-entrar" style="font-size: 14px; font-weight: 600; color: #C9CED6; padding: 0 4px;">Contraseña</label>
<div style="position: relative;">
<input id="clave-entrar" type="{{ tipo }}" autocomplete="current-password" style="width: 100%; height: 52px; padding: 0 56px 0 16px; border-radius: 14px; border: 1px solid #4A505B; background: #121418; color: #F2F2F3; font-size: 16px; box-sizing: border-box;">
<button type="button" class="toque" aria-label="{{ ojoEtiqueta }}" aria-pressed="{{ ver }}" onClick="{{ alternar }}" style="position: absolute; right: 4px; top: 4px; width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: #A1A9B6; display: flex; align-items: center; justify-content: center; transition: transform 120ms cubic-bezier(.2,0,0,1);"><span class="ms" aria-hidden="true">{{ ojo }}</span></button>
</div>
</div>
<a href="#" class="anim" style="align-self: flex-start; min-height: 44px; display: flex; align-items: center; padding: 0 4px; font-size: 15px; font-weight: 600; text-decoration: none; animation: entra 350ms cubic-bezier(.05,.7,.1,1) 260ms backwards;">¿Has olvidado tu contraseña?</a>
</div>
<div style="flex-grow: 1;"></div>
<div style="padding: 16px 16px 20px; display: flex; flex-direction: column; gap: 8px;">
<a href="Inicio.dc.html" class="anim toque" style="height: 52px; border-radius: 26px; background: #FF6A00; color: #1A0E00; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none; transition: transform 120ms cubic-bezier(.2,0,0,1); animation: entra 350ms cubic-bezier(.05,.7,.1,1) 300ms backwards;">Entrar</a>
<p class="anim" style="margin: 0; font-size: 15px; color: #C9CED6; text-align: center; animation: entra 350ms cubic-bezier(.05,.7,.1,1) 340ms backwards;">¿No tienes cuenta? <a href="Objetivo.dc.html" style="font-weight: 600; display: inline-block; padding: 12px 4px;">Empieza aquí</a></p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { ver: false };
  }
  renderVals() {
    const ver = this.state.ver;
    return {
      ver,
      tipo: ver ? 'text' : 'password',
      ojo: ver ? 'visibility_off' : 'visibility',
      ojoEtiqueta: ver ? 'Ocultar la contraseña' : 'Mostrar la contraseña',
      alternar: () => this.setState({ ver: !ver })
    };
  }
}
</script>
</body>
</html>
