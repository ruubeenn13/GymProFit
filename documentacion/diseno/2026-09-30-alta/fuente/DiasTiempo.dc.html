<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Días y tiempo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=block">
<style>
body{margin:0;background:#0B0C0E;font-family:'Barlow',sans-serif;color:#F2F2F3}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
button,input{font-family:inherit}
button{cursor:pointer}
a{color:#FF6A00}a:hover{color:#FFB27A}
.toque:active{transform:scale(.95)}
@keyframes entra{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes destello{0%{box-shadow:0 0 0 0 rgba(255,106,0,0)}40%{box-shadow:0 0 12px 3px rgba(255,106,0,.7)}100%{box-shadow:0 0 0 0 rgba(255,106,0,0)}}
@keyframes llena50{from{width:50%}}
@media (prefers-reduced-motion: reduce){.anim{animation:none !important;transition:none !important}.toque:active{transform:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0C0E; color: #F2F2F3; font-family: 'Barlow', sans-serif; display: flex; flex-direction: column;">
<header style="display: flex; align-items: center; gap: 8px; padding: 8px 20px 0 4px;">
<a href="Donde.dc.html" aria-label="Atrás" class="toque" style="flex-shrink: 0; width: 48px; height: 48px; border-radius: 24px; color: #F2F2F3; display: flex; align-items: center; justify-content: center; text-decoration: none; transition: transform 120ms cubic-bezier(.2,0,0,1);"><span class="ms" aria-hidden="true">arrow_back</span></a>
<div role="progressbar" aria-label="Progreso" aria-valuemin="0" aria-valuemax="100" aria-valuenow="75" aria-valuetext="Capítulo 3 de 4, tu entrenamiento" style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px;">
<span style="height: 6px; border-radius: 3px; background: #FF6A00;"></span>
<span style="height: 6px; border-radius: 3px; background: #FF6A00;"></span>
<span class="anim" style="height: 6px; border-radius: 3px; background: #252A31; animation: destello 700ms ease-out 650ms;"><span class="anim" style="display: block; width: 100%; height: 6px; border-radius: 3px; background: #FF6A00; animation: llena50 450ms cubic-bezier(.2,0,0,1) 150ms backwards;"></span></span>
<span style="height: 6px; border-radius: 3px; background: #252A31;"></span>
</div>
</header>
<div style="padding: 24px 20px 0; display: flex; flex-direction: column; gap: 10px;">
<span class="anim" style="color: #FFB27A; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; animation: entra 350ms cubic-bezier(.05,.7,.1,1) backwards;">Tu entrenamiento · 3 de 4</span>
<h1 class="anim" style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 34px; line-height: 1.08; animation: entra 350ms cubic-bezier(.05,.7,.1,1) 50ms backwards;">¿Cuánto puedes entrenar?</h1>
<p class="anim" style="margin: 0; font-size: 16px; line-height: 1.45; color: #C9CED6; animation: entra 350ms cubic-bezier(.05,.7,.1,1) 100ms backwards;">Tu programa se reparte en esos días y cada rutina cabe en ese tiempo. Puedes cambiarlo después.</p>
</div>
<div style="flex-grow: 1;"></div>
<div style="padding: 0 16px; display: flex; flex-direction: column; gap: 12px;">
<span id="etiqueta-dias" class="anim" style="color: #A1A9B6; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; padding: 0 4px; animation: entra 350ms cubic-bezier(.05,.7,.1,1) 160ms backwards;">Días por semana</span>
<div role="radiogroup" aria-labelledby="etiqueta-dias" class="anim" style="position: relative; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; animation: entra 350ms cubic-bezier(.05,.7,.1,1) 200ms backwards;">
<span aria-hidden="true" class="anim" style="position: absolute; top: 0; left: {{ pildoraDias }}; width: calc((100% - 32px) / 5); height: 56px; border-radius: 28px; background: #FF6A00; transition: left 320ms cubic-bezier(.34,1.56,.64,1);"></span>
<button type="button" role="radio" class="anim toque" aria-checked="{{ d2.sel }}" aria-label="2 días" onClick="{{ d2.pick }}" style="position: relative; height: 56px; border-radius: 28px; border: 1px solid {{ d2.borde }}; background: transparent; color: {{ d2.texto }}; font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 700; transition: border-color 200ms ease-out, color 200ms ease-out, transform 120ms cubic-bezier(.2,0,0,1);">2</button>
<button type="button" role="radio" class="anim toque" aria-checked="{{ d3.sel }}" aria-label="3 días" onClick="{{ d3.pick }}" style="position: relative; height: 56px; border-radius: 28px; border: 1px solid {{ d3.borde }}; background: transparent; color: {{ d3.texto }}; font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 700; transition: border-color 200ms ease-out, color 200ms ease-out, transform 120ms cubic-bezier(.2,0,0,1);">3</button>
<button type="button" role="radio" class="anim toque" aria-checked="{{ d4.sel }}" aria-label="4 días" onClick="{{ d4.pick }}" style="position: relative; height: 56px; border-radius: 28px; border: 1px solid {{ d4.borde }}; background: transparent; color: {{ d4.texto }}; font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 700; transition: border-color 200ms ease-out, color 200ms ease-out, transform 120ms cubic-bezier(.2,0,0,1);">4</button>
<button type="button" role="radio" class="anim toque" aria-checked="{{ d5.sel }}" aria-label="5 días" onClick="{{ d5.pick }}" style="position: relative; height: 56px; border-radius: 28px; border: 1px solid {{ d5.borde }}; background: transparent; color: {{ d5.texto }}; font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 700; transition: border-color 200ms ease-out, color 200ms ease-out, transform 120ms cubic-bezier(.2,0,0,1);">5</button>
<button type="button" role="radio" class="anim toque" aria-checked="{{ d6.sel }}" aria-label="6 días" onClick="{{ d6.pick }}" style="position: relative; height: 56px; border-radius: 28px; border: 1px solid {{ d6.borde }}; background: transparent; color: {{ d6.texto }}; font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 700; transition: border-color 200ms ease-out, color 200ms ease-out, transform 120ms cubic-bezier(.2,0,0,1);">6</button>
</div>
<div role="img" aria-label="{{ ejemplo }}" class="anim" style="display: flex; align-items: center; gap: 10px; padding: 2px 4px 0; animation: entra 350ms cubic-bezier(.05,.7,.1,1) 240ms backwards;">
<span style="font-size: 14px; color: #A1A9B6;">Por ejemplo</span>
<div style="display: flex; gap: 6px;">
<span class="anim" style="width: 30px; height: 30px; border-radius: 15px; background: {{ l.fondo }}; color: {{ l.texto }}; transform: scale({{ l.escala }}); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; transition: background-color 220ms ease-out 0ms, color 220ms ease-out 0ms, transform 280ms cubic-bezier(.34,1.56,.64,1) 0ms;">L</span>
<span class="anim" style="width: 30px; height: 30px; border-radius: 15px; background: {{ m.fondo }}; color: {{ m.texto }}; transform: scale({{ m.escala }}); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; transition: background-color 220ms ease-out 35ms, color 220ms ease-out 35ms, transform 280ms cubic-bezier(.34,1.56,.64,1) 35ms;">M</span>
<span class="anim" style="width: 30px; height: 30px; border-radius: 15px; background: {{ x.fondo }}; color: {{ x.texto }}; transform: scale({{ x.escala }}); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; transition: background-color 220ms ease-out 70ms, color 220ms ease-out 70ms, transform 280ms cubic-bezier(.34,1.56,.64,1) 70ms;">X</span>
<span class="anim" style="width: 30px; height: 30px; border-radius: 15px; background: {{ j.fondo }}; color: {{ j.texto }}; transform: scale({{ j.escala }}); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; transition: background-color 220ms ease-out 105ms, color 220ms ease-out 105ms, transform 280ms cubic-bezier(.34,1.56,.64,1) 105ms;">J</span>
<span class="anim" style="width: 30px; height: 30px; border-radius: 15px; background: {{ v.fondo }}; color: {{ v.texto }}; transform: scale({{ v.escala }}); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; transition: background-color 220ms ease-out 140ms, color 220ms ease-out 140ms, transform 280ms cubic-bezier(.34,1.56,.64,1) 140ms;">V</span>
<span class="anim" style="width: 30px; height: 30px; border-radius: 15px; background: {{ s.fondo }}; color: {{ s.texto }}; transform: scale({{ s.escala }}); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; transition: background-color 220ms ease-out 175ms, color 220ms ease-out 175ms, transform 280ms cubic-bezier(.34,1.56,.64,1) 175ms;">S</span>
<span class="anim" style="width: 30px; height: 30px; border-radius: 15px; background: {{ d.fondo }}; color: {{ d.texto }}; transform: scale({{ d.escala }}); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; transition: background-color 220ms ease-out 210ms, color 220ms ease-out 210ms, transform 280ms cubic-bezier(.34,1.56,.64,1) 210ms;">D</span>
</div>
</div>
<span id="etiqueta-tiempo" class="anim" style="margin-top: 12px; color: #A1A9B6; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; padding: 0 4px; animation: entra 350ms cubic-bezier(.05,.7,.1,1) 280ms backwards;">Tiempo por sesión</span>
<div role="radiogroup" aria-labelledby="etiqueta-tiempo" class="anim" style="position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; animation: entra 350ms cubic-bezier(.05,.7,.1,1) 320ms backwards;">
<span aria-hidden="true" class="anim" style="position: absolute; top: 0; left: {{ pildoraMin }}; width: calc((100% - 24px) / 4); height: 52px; border-radius: 26px; background: #FF6A00; transition: left 320ms cubic-bezier(.34,1.56,.64,1);"></span>
<button type="button" role="radio" class="anim toque" aria-checked="{{ m30.sel }}" onClick="{{ m30.pick }}" style="position: relative; height: 52px; border-radius: 26px; border: 1px solid {{ m30.borde }}; background: transparent; color: {{ m30.texto }}; font-size: 15px; font-weight: {{ m30.peso }}; transition: border-color 200ms ease-out, color 200ms ease-out, transform 120ms cubic-bezier(.2,0,0,1);">30 min</button>
<button type="button" role="radio" class="anim toque" aria-checked="{{ m45.sel }}" onClick="{{ m45.pick }}" style="position: relative; height: 52px; border-radius: 26px; border: 1px solid {{ m45.borde }}; background: transparent; color: {{ m45.texto }}; font-size: 15px; font-weight: {{ m45.peso }}; transition: border-color 200ms ease-out, color 200ms ease-out, transform 120ms cubic-bezier(.2,0,0,1);">45 min</button>
<button type="button" role="radio" class="anim toque" aria-checked="{{ m60.sel }}" onClick="{{ m60.pick }}" style="position: relative; height: 52px; border-radius: 26px; border: 1px solid {{ m60.borde }}; background: transparent; color: {{ m60.texto }}; font-size: 15px; font-weight: {{ m60.peso }}; transition: border-color 200ms ease-out, color 200ms ease-out, transform 120ms cubic-bezier(.2,0,0,1);">60 min</button>
<button type="button" role="radio" class="anim toque" aria-checked="{{ m75.sel }}" onClick="{{ m75.pick }}" style="position: relative; height: 52px; border-radius: 26px; border: 1px solid {{ m75.borde }}; background: transparent; color: {{ m75.texto }}; font-size: 15px; font-weight: {{ m75.peso }}; transition: border-color 200ms ease-out, color 200ms ease-out, transform 120ms cubic-bezier(.2,0,0,1);">75+ min</button>
</div>
</div>
<div style="padding: 24px 16px 24px;">
<a href="Plan.dc.html" class="anim toque" style="height: 52px; border-radius: 26px; background: #FF6A00; color: #1A0E00; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none; transition: transform 120ms cubic-bezier(.2,0,0,1); animation: entra 350ms cubic-bezier(.05,.7,.1,1) 380ms backwards;">Ver mi plan</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { dias: 3, min: 45 };
  }
  renderVals() {
    const chip = (si, pick) => ({
      sel: si,
      borde: si ? 'transparent' : '#4A505B',
      texto: si ? '#1A0E00' : '#F2F2F3',
      peso: si ? '700' : '500',
      pick
    });
    const d = (n) => chip(this.state.dias === n, () => this.setState({ dias: n }));
    const m = (n) => chip(this.state.min === n, () => this.setState({ min: n }));
    const iDias = this.state.dias - 2;
    const iMin = [30, 45, 60, 75].indexOf(this.state.min);
    const semanas = {
      2: ['l', 'j'],
      3: ['l', 'x', 'v'],
      4: ['l', 'm', 'j', 'v'],
      5: ['l', 'm', 'x', 'j', 'v'],
      6: ['l', 'm', 'x', 'j', 'v', 's']
    };
    const ejemplos = {
      2: 'Por ejemplo, lunes y jueves',
      3: 'Por ejemplo, lunes, miércoles y viernes',
      4: 'Por ejemplo, lunes, martes, jueves y viernes',
      5: 'Por ejemplo, de lunes a viernes',
      6: 'Por ejemplo, de lunes a sábado'
    };
    const activos = semanas[this.state.dias];
    const dia = (k) => {
      const on = activos.indexOf(k) >= 0;
      return {
        fondo: on ? '#FF6A00' : '#1B1E24',
        texto: on ? '#1A0E00' : '#6F7784',
        escala: on ? '1' : '0.86'
      };
    };
    return {
      d2: d(2), d3: d(3), d4: d(4), d5: d(5), d6: d(6),
      m30: m(30), m45: m(45), m60: m(60), m75: m(75),
      pildoraDias: 'calc((100% - 32px) / 5 * ' + iDias + ' + ' + (iDias * 8) + 'px)',
      pildoraMin: 'calc((100% - 24px) / 4 * ' + iMin + ' + ' + (iMin * 8) + 'px)',
      l: dia('l'), m: dia('m'), x: dia('x'), j: dia('j'), v: dia('v'), s: dia('s'), d: dia('d'),
      ejemplo: ejemplos[this.state.dias]
    };
  }
}
</script>
</body>
</html>
