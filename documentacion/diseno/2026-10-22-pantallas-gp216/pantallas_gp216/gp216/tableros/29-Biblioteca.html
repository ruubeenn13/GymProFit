<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Biblioteca de ejercicios</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=block">
<style>
body{margin:0;background:#0B0C0E;font-family:'Barlow',sans-serif;color:#F2F2F3}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;display:inline-block;white-space:nowrap;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.ms.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
button{font-family:inherit;cursor:pointer}
a{color:#FF8A3D}a:hover{color:#FFB27A}
.toque{transition:transform 120ms cubic-bezier(.2,0,0,1),background-color 150ms cubic-bezier(.2,0,0,1)}.toque:active{transform:scale(.97)}
.bc{font-family:'Barlow Condensed',sans-serif;font-weight:700}
.caja{margin:0 20px;border-radius:24px;background:#1B1E24}
.fila{display:flex;align-items:center;gap:14px;min-height:64px;padding:0 16px;text-decoration:none;color:#F2F2F3;background:transparent;border:none;width:100%;box-sizing:border-box;text-align:left;font-size:16px}
.ico{flex-shrink:0;width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center}
.sub{font-size:13px;color:#A1A9B6}
.sep{height:1px;background:#252A31;margin-left:70px}
.rot{margin:0 20px;font-size:14px;font-weight:600;color:#A1A9B6}
.sw{flex-shrink:0;width:52px;height:32px;border-radius:16px;position:relative;transition:background-color 200ms cubic-bezier(.2,0,0,1)}
.sw i{position:absolute;top:4px;width:24px;height:24px;border-radius:12px;transition:left 200ms cubic-bezier(.2,0,0,1)}
@media (prefers-reduced-motion: reduce){.toque,.sw,.sw i{transition:none}.toque:active{transform:none}}
</style>
</helmet>
<div style="width: 390px; height: 1400px; position: relative; overflow: hidden; background: #0B0C0E; color: #F2F2F3; font-family: 'Barlow', sans-serif;">
<header style="padding: 12px 8px 0 4px; display: flex; align-items: center;"><button type="button" aria-label="Volver" class="toque" style="width: 48px; height: 48px; border: none; border-radius: 24px; background: transparent; color: #F2F2F3;"><span class="ms" aria-hidden="true">arrow_back</span></button><h1 style="margin: 0; font-size: 19px; font-weight: 600;">Ejercicios</h1></header>
<div style="margin: 12px 20px 0; min-height: 56px; border-radius: 28px; background: #1B1E24; display: flex; align-items: center; gap: 10px; padding: 0 6px 0 18px;"><span class="ms" aria-hidden="true" style="color: #A1A9B6;">search</span><span style="flex-grow: 1; font-size: 16px; color: #8A93A1;">Busca entre 873 ejercicios</span><button type="button" aria-label="Filtros: material y nivel" class="toque" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: #252A31; color: #F2F2F3;"><span class="ms" aria-hidden="true">tune</span></button></div>
<div role="radiogroup" aria-label="Grupo muscular" style="display: flex; gap: 8px; overflow-x: auto; padding: 16px 20px 4px; scrollbar-width: none;"><sc-for list="{{ grupos }}" as="g" hint-placeholder-count="7"><button type="button" role="radio" aria-checked="{{ g.on }}" onClick="{{ g.tap }}" class="toque" style="flex-shrink: 0; min-height: 44px; padding: 0 14px 0 10px; border: none; border-radius: 22px; background: {{ g.bg }}; color: {{ g.co }}; display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600;"><span class="ms" aria-hidden="true" style="font-size: 20px;">{{ g.ic }}</span>{{ g.t }}</button></sc-for></div>
<main style="padding: 24px 0 40px; display: flex; flex-direction: column; gap: 28px;">
<section aria-label="Los que más haces" style="display: flex; flex-direction: column; gap: 12px;"><h2 style="margin: 0 20px; font-size: 20px; font-weight: 600;">Los que más haces</h2>
<div style="display: flex; gap: 12px; overflow-x: auto; padding: 0 20px 4px; scrollbar-width: none;"><a href="#" class="toque" style="flex-shrink: 0; width: 150px; border-radius: 22px; background: #1B1E24; text-decoration: none; color: #F2F2F3; overflow: hidden;"><img src="../img/ej_Barbell_Full_Squat.webp" alt="" style="display: block; width: 150px; height: 100px; object-fit: cover;"><span style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px 12px;"><span style="font-size: 15px; font-weight: 600; line-height: 1.2;">Sentadilla con barra</span><span style="font-size: 13px; color: #E8B84B;">80 kg × 10</span></span></a><a href="#" class="toque" style="flex-shrink: 0; width: 150px; border-radius: 22px; background: #1B1E24; text-decoration: none; color: #F2F2F3; overflow: hidden;"><img src="../img/ej_Bench_t.webp" alt="" style="display: block; width: 150px; height: 100px; object-fit: cover;"><span style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px 12px;"><span style="font-size: 15px; font-weight: 600; line-height: 1.2;">Press de banca</span><span style="font-size: 13px; color: #E8B84B;">80 kg × 8</span></span></a><a href="#" class="toque" style="flex-shrink: 0; width: 150px; border-radius: 22px; background: #1B1E24; text-decoration: none; color: #F2F2F3; overflow: hidden;"><img src="../img/ej_Bent_Over_Barbell_Row.webp" alt="" style="display: block; width: 150px; height: 100px; object-fit: cover;"><span style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px 12px;"><span style="font-size: 15px; font-weight: 600; line-height: 1.2;">Remo con barra</span><span style="font-size: 13px; color: #E8B84B;">70 kg × 10</span></span></a></div></section>
<section aria-label="Lista" style="display: flex; flex-direction: column; gap: 12px;"><div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 20px;"><h2 style="margin: 0; font-size: 20px; font-weight: 600;">De la A a la Z</h2><span aria-live="polite" class="sub" style="font-size: 14px;">{{ cuantos }}</span></div>
<div class="caja" style="padding: 4px 0;"><sc-for list="{{ lista }}" as="e" hint-placeholder-count="9"><a href="#" class="fila toque" style="min-height: 76px; border-bottom: 1px solid #22262C;"><img src="{{ e.img }}" alt="" style="flex-shrink: 0; width: 52px; height: 52px; border-radius: 16px; object-fit: cover; background: #F2F2F3;"><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px;"><span style="font-size: 16px; font-weight: 600;">{{ e.n }}</span><span class="sub">{{ e.d }}</span></span><span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #C9CED6;"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: {{ e.nc }};"></span>{{ e.nivel }}</span></a></sc-for></div></section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1400}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { g: 0 }; }
  renderVals() {
    const G = [['Todos','apps'],['Pecho','fitness_center'],['Espalda','rowing'],['Pierna','directions_walk'],['Hombros','accessibility_new'],['Brazos','sports_martial_arts'],['Core','self_improvement']];
    const E = [
      ['Press de banca con barra','Pecho · Barra','Intermedio',1,true],['Aperturas en máquina','Pecho · Máquina','Principiante',1,false],
      ['Remo con barra','Espalda · Barra','Intermedio',2,true],['Jalón al pecho','Espalda · Polea','Principiante',2,false],
      ['Sentadilla con barra','Pierna · Barra','Intermedio',3,true],['Prensa de piernas','Pierna · Máquina','Principiante',3,false],
      ['Press militar de pie','Hombros · Barra','Intermedio',4,false],['Curl de bíceps con barra','Brazos · Barra','Principiante',5,false],
      ['Plancha','Core · Sin material','Principiante',6,false]
    ];
    const g = this.state.g;
    const L = E.filter(e => g === 0 || e[3] === g);
    const IM = {"Press de banca con barra": "ej_Bench_t.webp", "Press de banca": "ej_Bench_t.webp", "Aperturas en máquina": "ej_Butterfly.webp", "Remo con barra": "ej_Bent_Over_Barbell_Row.webp", "Jalón al pecho": "ej_Wide-Grip_Lat_Pulldown.webp", "Sentadilla con barra": "ej_Barbell_Full_Squat.webp", "Prensa de piernas": "ej_Leg_Press.webp", "Press militar de pie": "ej_Standing_Military_Press.webp", "Curl de bíceps con barra": "ej_Barbell_Curl.webp", "Plancha": "ej_Plank.webp", "Elevaciones laterales": "ej_Side_Lateral_Raise.webp", "Extensión de tríceps en polea": "ej_Triceps_Pushdown.webp"};
    const NC = { Principiante: '#4ADE80', Intermedio: '#E8B84B', Avanzado: '#FF8A80' };
    return {
      grupos: G.map((x, i) => ({ t: x[0], ic: x[1], on: String(i === g), bg: i === g ? '#FF6A00' : '#1B1E24', co: i === g ? '#1A0E00' : '#F2F2F3', tap: () => this.setState({ g: i }) })),
      cuantos: L.length + (L.length === 1 ? ' ejercicio' : ' ejercicios'),
      lista: L.map(e => ({ img: '../img/' + IM[e[0]], n: e[0], d: e[1], nivel: e[2], nc: NC[e[2]], tuyo: e[4] }))
    };
  }
}
</script>
</body>
</html>
