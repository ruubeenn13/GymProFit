<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Elegir tema</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=block">
<style>
body{margin:0;background:#0B0C0E;font-family:'Barlow',sans-serif;color:#F2F2F3}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;display:inline-block;white-space:nowrap;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.ms.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
button{font-family:inherit;cursor:pointer}
a{color:#FF8A3D}a:hover{color:#FFB27A}
.toque{transition:transform 120ms cubic-bezier(.2,0,0,1),background-color 150ms cubic-bezier(.2,0,0,1)}.toque:active{transform:scale(.97)}
.bc{font-family:'Barlow Condensed',sans-serif;font-weight:700}
.caja{margin:0 20px;border-radius:24px;background:#1B1E24}
.fila{display:flex;align-items:center;gap:14px;min-height:64px;padding:0 16px;text-decoration:none;color:#F2F2F3;background:transparent;border:none;width:100%;box-sizing:border-box;text-align:left;font-size:16px}
.ico{flex-shrink:0;width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center}
.sub{font-size:13px;color:#A1A9B6}
.sep{height:1px;background:#252A31;margin-left:70px}
.rot{margin:0 20px;font-size:14px;font-weight:600;color:#A1A9B6}
.sw{flex-shrink:0;width:52px;height:32px;border-radius:16px;position:relative;transition:background-color 200ms cubic-bezier(.2,0,0,1)}
.sw i{position:absolute;top:4px;width:24px;height:24px;border-radius:12px;transition:left 200ms cubic-bezier(.2,0,0,1)}
@media (prefers-reduced-motion: reduce){.toque,.sw,.sw i{transition:none}.toque:active{transform:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0C0E; color: #F2F2F3; font-family: 'Barlow', sans-serif;">
<header style="padding: 12px 8px 0 4px; display: flex; align-items: center;"><button type="button" aria-label="Volver" class="toque" style="width: 48px; height: 48px; border: none; border-radius: 24px; background: transparent; color: #F2F2F3;"><span class="ms" aria-hidden="true">arrow_back</span></button><h1 style="margin: 0; font-size: 19px; font-weight: 600;">Perfil y ajustes</h1></header>
<div aria-hidden="true" style="padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; opacity: .5;"><span class="caja" style="margin: 0; height: 120px;"></span><span class="caja" style="margin: 0; height: 220px;"></span></div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(5,6,8,.6);"></div>
<section role="dialog" aria-label="Tema" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 28px; border-radius: 28px 28px 0 0; background: #1B1E24; display: flex; flex-direction: column; gap: 18px;">
<span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #4A505B;"></span>
<h2 class="bc" style="margin: 0; font-size: 26px;">Tema</h2>
<div role="radiogroup" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;"><sc-for list="{{ temas }}" as="t" hint-placeholder-count="2"><button type="button" role="radio" aria-checked="{{ t.on }}" onClick="{{ t.tap }}" class="toque" style="padding: 10px; border-radius: 22px; border: 2px solid {{ t.borde }}; background: #121418; color: #F2F2F3; display: flex; flex-direction: column; gap: 10px;"><span aria-hidden="true" style="height: 132px; border-radius: 14px; background: {{ t.f }}; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px;"><span style="width: 50%; height: 8px; border-radius: 4px; background: {{ t.tx }};"></span><span style="height: 44px; border-radius: 10px; background: #FF6A00;"></span><span style="height: 30px; border-radius: 10px; background: {{ t.c }};"></span><span style="height: 18px; border-radius: 8px; background: {{ t.c }};"></span></span><span style="display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 600;"><span class="ms" aria-hidden="true" style="color: {{ t.rc }};">{{ t.radio }}</span>{{ t.n }}</span></button></sc-for></div>
<p class="sub" style="margin: 0; font-size: 14px;">Se aplica al momento. Idioma, vaso de agua y descanso usan esta misma hoja.</p>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { t: 0 }; }
  renderVals() {
    const T = [['Oscuro','#0B0C0E','#1B1E24','#F2F2F3'],['Claro','#F6F6F7','#FFFFFF','#16181C']];
    return { temas: T.map((x, i) => { const on = i === this.state.t; return { n: x[0], f: x[1], c: x[2], tx: x[3], on: String(on), borde: on ? '#FF6A00' : '#353A43', radio: on ? 'radio_button_checked' : 'radio_button_unchecked', rc: on ? '#FF6A00' : '#676F7E', tap: () => this.setState({ t: i }) }; }) };
  }
}
</script>
</body>
</html>
