<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Notificaciones</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=block">
<style>
body{margin:0;background:#0B0C0E;font-family:'Barlow',sans-serif;color:#F2F2F3}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;display:inline-block;white-space:nowrap;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.ms.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
button{font-family:inherit;cursor:pointer}
a{color:#FF8A3D}a:hover{color:#FFB27A}
.toque{transition:transform 120ms cubic-bezier(.2,0,0,1),background-color 150ms cubic-bezier(.2,0,0,1)}.toque:active{transform:scale(.97)}
.bc{font-family:'Barlow Condensed',sans-serif;font-weight:700}
.caja{margin:0 20px;border-radius:24px;background:#1B1E24}
.fila{display:flex;align-items:center;gap:14px;min-height:64px;padding:0 16px;text-decoration:none;color:#F2F2F3;background:transparent;border:none;width:100%;box-sizing:border-box;text-align:left;font-size:16px}
.ico{flex-shrink:0;width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center}
.sub{font-size:13px;color:#A1A9B6}
.sep{height:1px;background:#252A31;margin-left:70px}
.rot{margin:0 20px;font-size:14px;font-weight:600;color:#A1A9B6}
.sw{flex-shrink:0;width:52px;height:32px;border-radius:16px;position:relative;transition:background-color 200ms cubic-bezier(.2,0,0,1)}
.sw i{position:absolute;top:4px;width:24px;height:24px;border-radius:12px;transition:left 200ms cubic-bezier(.2,0,0,1)}
@media (prefers-reduced-motion: reduce){.toque,.sw,.sw i{transition:none}.toque:active{transform:none}}
</style>
</helmet>
<div style="width: 390px; height: 900px; position: relative; overflow: hidden; background: #0B0C0E; color: #F2F2F3; font-family: 'Barlow', sans-serif;">
<header style="padding: 12px 8px 0 4px; display: flex; align-items: center;"><button type="button" aria-label="Volver" class="toque" style="width: 48px; height: 48px; border: none; border-radius: 24px; background: transparent; color: #F2F2F3;"><span class="ms" aria-hidden="true">arrow_back</span></button><h1 style="margin: 0; font-size: 19px; font-weight: 600;">Notificaciones</h1></header>
<main style="padding: 16px 0 40px; display: flex; flex-direction: column; gap: 28px;">
<sc-if value="{{ sinPermiso }}" hint-placeholder-val="{{ true }}"><section aria-label="Permiso" style="margin: 0 20px; padding: 16px; border-radius: 24px; background: #3A2110; display: flex; gap: 12px; align-items: flex-start;">
<span aria-hidden="true" style="flex-shrink: 0; position: relative; width: 52px; height: 52px; border-radius: 26px; overflow: hidden; background: #0B0C0E;"><img src="../img/profi_cara.webp" alt="" style="position: absolute; left: 0; top: 0; width: 100%;"></span>
<span style="display: flex; flex-direction: column; gap: 12px;"><span style="font-size: 15px; line-height: 1.35; color: #FFE3CC;"><strong style="color: #FFF4E8;">Ahora mismo no puedo avisarte.</strong> Android me lo bloquea hasta que lo actives.</span><button type="button" onClick="{{ activar }}" class="toque" style="align-self: flex-start; min-height: 44px; padding: 0 20px; border: none; border-radius: 22px; background: #FF6A00; color: #1A0E00; font-size: 15px; font-weight: 700;">Activar avisos</button></span></section></sc-if>
<section aria-label="Qué te avisamos" style="display: flex; flex-direction: column; gap: 10px;"><h2 class="rot">Qué te avisamos</h2>
<div class="caja" style="padding: 4px 0;"><sc-for list="{{ filas }}" as="f" hint-placeholder-count="4"><button type="button" role="switch" aria-checked="{{ f.on }}" onClick="{{ f.tap }}" class="fila toque" style="min-height: 76px; opacity: {{ f.op }};"><span class="ico" style="background: #252A31; color: #C9CED6;"><span class="ms" aria-hidden="true" style="font-size: 22px;">{{ f.ic }}</span></span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><span>{{ f.t }}</span><span class="sub">{{ f.s }}</span></span><span class="sw" aria-hidden="true" style="background: {{ f.bg }};"><i style="left: {{ f.x }}; background: {{ f.bo }};"></i></span></button></sc-for></div></section>
<a href="#" class="caja fila toque" style="width: auto;"><span class="ico" style="background: #252A31; color: #C9CED6;"><span class="ms" aria-hidden="true" style="font-size: 22px;">settings</span></span><span style="flex-grow: 1;">Sonido y estilo en Android</span><span class="ms" aria-hidden="true" style="color: #676F7E; font-size: 20px;">open_in_new</span></a>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { on: [true, true, false, true], permiso: false }; }
  renderVals() {
    const L = [['timer','Fin de cada descanso','Aunque tengas la pantalla apagada. Va con la sesión'],['event_repeat','Recordarme entrenar','Si pasan 3 días sin entrenar'],['restaurant','Recordarme las comidas','A su hora, si no has apuntado esa comida'],['emoji_events','Tu progreso','Logros, el resumen del domingo y pesarte cada mes']];
    const p = this.state.permiso;
    return {
      sinPermiso: !p,
      filas: L.map((l, i) => { const on = this.state.on[i]; return { ic: l[0], t: l[1], s: l[2], on: String(on), bg: on ? '#FF6A00' : '#353A43', x: on ? '24px' : '4px', bo: on ? '#1A0E00' : '#A1A9B6', op: p ? '1' : '.5',
        tap: () => { const a = this.state.on.slice(); a[i] = !a[i]; this.setState({ on: a }); } }; }),
      activar: () => this.setState({ permiso: true })
    };
  }
}
</script>
</body>
</html>
