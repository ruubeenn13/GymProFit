<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Una comida, sin apuntar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=block">
<style>
body{margin:0;background:#0B0C0E;font-family:'Barlow',sans-serif;color:#F2F2F3}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.ms.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
button,input{font-family:inherit}
button{cursor:pointer}
a{color:#FF6A00}a:hover{color:#FFB27A}
.toque{transition:transform 120ms cubic-bezier(.2,0,0,1)}
.toque:active{transform:scale(.97)}
@keyframes entra{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes salta{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes pop{0%{transform:scale(.6)}55%{transform:scale(1.12)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.anim{animation:none !important;transition:none !important}.toque:active{transform:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0C0E; color: #F2F2F3; font-family: 'Barlow', sans-serif;">
<header style="display: flex; align-items: center; gap: 4px; padding: 8px 4px 0;">
<a href="Main.dc.html" aria-label="Atrás" class="toque" style="width: 48px; height: 48px; border-radius: 24px; color: #F2F2F3; display: flex; align-items: center; justify-content: center; text-decoration: none;"><span class="ms" aria-hidden="true">arrow_back</span></a>
<div style="flex-grow: 1; display: flex; flex-direction: column;">
<h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px; line-height: 1.1;">Merienda</h1>
<span style="font-size: 14px; color: #A1A9B6;">Hoy, jueves 1 de octubre</span>
</div>
</header>
<main style="padding: 12px 16px 130px; display: flex; flex-direction: column; gap: 16px;">
<section class="anim" style="padding: 20px 8px 8px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; animation: entra 350ms cubic-bezier(.05,.7,.1,1) backwards;">
<span class="anim" aria-hidden="true" style="width: 72px; height: 72px; border-radius: 24px; background: #3A2110; color: #FFB27A; display: flex; align-items: center; justify-content: center; animation: pop 450ms cubic-bezier(.34,1.56,.64,1) 150ms backwards;"><span class="ms" style="font-size: 36px;">cookie</span></span>
<h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; line-height: 1.1;">Aún no has apuntado la merienda</h2>
<span style="font-size: 15px; color: #FFB27A;">Es la que toca ahora</span>
</section>
<sc-if value="{{ sugerencia }}" hint-placeholder-val="{{ true }}">
<section aria-label="Copiar la de ayer" class="anim" style="background: #1B1E24; border: 1px solid #676F7E; border-radius: 20px; padding: 14px 8px 14px 16px; display: flex; align-items: center; gap: 12px; animation: entra 350ms cubic-bezier(.05,.7,.1,1) 100ms backwards;">
<span class="ms" aria-hidden="true" style="flex-shrink: 0; color: #FFB27A;">content_copy</span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 16px; font-weight: 600;">¿Copiar la de ayer?</span><span style="font-size: 14px; color: #A1A9B6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Pan integral, pechuga de pavo · 203 kcal</span></span>
<a href="Comida.dc.html" aria-label="Sí, copiar la merienda de ayer" class="toque" style="flex-shrink: 0; width: 48px; height: 48px; border-radius: 24px; background: #3A2110; color: #FF6A00; display: flex; align-items: center; justify-content: center; text-decoration: none;"><span class="ms" aria-hidden="true">check</span></a>
<button type="button" onClick="{{ ocultar }}" aria-label="No, hoy no" class="toque" style="flex-shrink: 0; width: 48px; height: 48px; border: none; border-radius: 24px; background: transparent; color: #A1A9B6; display: flex; align-items: center; justify-content: center;"><span class="ms" aria-hidden="true">close</span></button>
</section>
</sc-if>
<section aria-label="Lo que sueles merendar" style="display: flex; flex-direction: column; gap: 8px;">
<h2 style="margin: 0; padding: 0 4px; color: #A1A9B6; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 1px; text-transform: uppercase;">Lo que sueles merendar</h2>
<div style="background: #1B1E24; border: 1px solid #4A505B; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column;">
<sc-for list="{{ habituales }}" as="r" hint-placeholder-count="3">
<div class="anim" style="display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 14px; border-bottom: 1px solid #252A31; animation: entra 350ms cubic-bezier(.05,.7,.1,1) backwards; animation-delay: {{ r.retraso }};">
<span aria-hidden="true" style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 14px; background: #252A31; display: flex; align-items: center; justify-content: center;"><span class="ms" style="color: #C9CED6;">{{ r.icono }}</span></span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ r.nombre }}</span><span style="font-size: 14px; color: #A1A9B6;">{{ r.cantidad }}</span></span>
<sc-if value="{{ r.libre }}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{ r.tocar }}" aria-label="{{ r.etiqueta }}" class="toque" style="flex-shrink: 0; width: 44px; height: 44px; border: none; border-radius: 22px; background: #252A31; color: #F2F2F3; display: flex; align-items: center; justify-content: center;"><span class="ms" aria-hidden="true">add</span></button>
</sc-if>
<sc-if value="{{ r.anadido }}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{ r.tocar }}" aria-label="Añadido. Tocar para quitarlo" class="toque" style="flex-shrink: 0; width: 44px; height: 44px; border: none; border-radius: 22px; background: #143323; color: #4ADE80; display: flex; align-items: center; justify-content: center;"><span class="ms anim" aria-hidden="true" style="animation: salta 260ms cubic-bezier(.34,1.56,.64,1) backwards;">check</span></button>
</sc-if>
</div>
</sc-for>
</div>
</section>
</main>
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 24px; background: #121418; border-top: 1px solid #252A31; display: flex; align-items: center; gap: 10px;">
<a href="Anadir.dc.html" class="toque" style="flex-grow: 1; min-height: 52px; border-radius: 26px; background: #FF6A00; color: #1A0E00; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 700; text-decoration: none;"><span class="ms" aria-hidden="true">add</span>Añadir alimento</a>
<a href="Escaner.dc.html" aria-label="Escanear un código de barras" class="toque" style="flex-shrink: 0; width: 52px; height: 52px; border-radius: 26px; background: #252A31; color: #F2F2F3; display: flex; align-items: center; justify-content: center; text-decoration: none;"><span class="ms" aria-hidden="true">barcode_scanner</span></a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { anadidos: {}, oculta: false };
  }
  renderVals() {
    const base = [
      { id: 'yogur', icono: 'breakfast_dining', nombre: 'Yogur proteico natural', cantidad: '1 envase (200 g) · 120 kcal' },
      { id: 'platano', icono: 'nutrition', nombre: 'Plátano', cantidad: '1 unidad (120 g) · 107 kcal' },
      { id: 'nueces', icono: 'eco', nombre: 'Nueces', cantidad: '20 g · 131 kcal' }
    ];
    const habituales = base.map((r, i) => {
      const marcado = !!this.state.anadidos[r.id];
      return {
        ...r,
        retraso: (200 + i * 40) + 'ms',
        anadido: marcado,
        libre: !marcado,
        etiqueta: 'Añadir ' + r.nombre.toLowerCase() + ', ' + r.cantidad,
        tocar: () => {
          const nuevos = { ...this.state.anadidos };
          if (nuevos[r.id]) delete nuevos[r.id]; else nuevos[r.id] = true;
          this.setState({ anadidos: nuevos });
        }
      };
    });
    return {
      habituales,
      sugerencia: !this.state.oculta,
      ocultar: () => this.setState({ oculta: true })
    };
  }
}
</script>
</body>
</html>
