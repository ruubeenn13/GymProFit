# ============================================================
# Perfil PROD — 12-factor: TODOS los datos sensibles vienen de variables
# de entorno inyectadas por la PaaS (Render/Koyeb). Este fichero NO contiene
# secretos, por eso SÍ se versiona. La config común se hereda de
# application.properties.
# ============================================================

# --- Datasource (BD gestionada, p.ej. Aiven MySQL) ---
# El driver mariadb conecta contra MySQL sin problema. La URL/usuario/password
# se pasan como variables de entorno desde la PaaS.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Pool de conexiones
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# --- JPA/Hibernate ---
# Sin dialecto explícito: Hibernate lo autodetecta de la conexión (MySQL en Aiven).
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

# --- Flyway (crea/valida el esquema al arrancar contra la BD gestionada) ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# --- jOOQ ---
# Dialecto FIJADO a mano, no deducido de la conexion. Sin esto, jOOQ generaba SQL estandar
# (OFFSET ... ROWS FETCH NEXT ... ROWS ONLY) que MySQL no entiende, y toda consulta paginada
# (GET /admin/usuarios) reventaba con 500 solo en produccion.
spring.jooq.sql-dialect=MYSQL

# --- JWT (secreto SIEMPRE por entorno; nunca en el repo) ---
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:1800000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:2592000000}

# --- Usuario administrador semilla ---
# Sin valor por defecto en el codigo ni aqui: si ADMIN_PASSWORD no esta definida no se
# crea NINGUNA cuenta con rol ADMIN (DataInitializer lo deja anotado en el log). Antes la
# contrasena del admin estaba escrita en DataInitializer, y como Render arranca con este
# perfil, produccion tenia una cuenta de administracion con credenciales publicadas en un
# repositorio publico. A diferencia del correo, su ausencia NO impide arrancar: una API sin
# panel de administracion sigue sirviendo a sus usuarios.
app.seed.admin.password=${ADMIN_PASSWORD:}

# --- Servidor ---
# La PaaS asigna el puerto por la variable PORT; default 8080 en local.
server.port=${PORT:8080}

# --- Subida de fotos de perfil ---
# En un contenedor efímero el disco no persiste; ruta escribible temporal.
# (Para persistencia real habría que usar almacenamiento externo/objeto.)
app.upload.dir=${APP_UPLOAD_DIR:/tmp/uploads/fotos-perfil}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- Rate limiting por IP (2 niveles) ---
# Nivel estricto (login/register/guest/refresh/change-password): anti fuerza bruta.
app.auth.rate-limit.enabled=true
app.auth.rate-limit.max-requests=15
app.auth.rate-limit.window-seconds=60
# Nivel global (resto de rutas): backstop anti scraping/DoS; cupo alto que un usuario real no alcanza.
app.rate-limit.global.max-requests=200
app.rate-limit.global.window-seconds=60

# --- Correo transaccional (Brevo, SMTP) — OBLIGATORIO en produccion ---
# Sin valor por defecto, igual que JWT_SECRET: si falta cualquiera de las cuatro (host,
# usuario, clave y remitente), la API
# NO arranca. Antes llevaban default vacio y la consecuencia era peor que no arrancar:
# Spring no creaba JavaMailSender, EmailService escribia el codigo de recuperacion en
# claro en el log y POST /auth/forgot-password respondia 200 sin haber enviado nada, asi
# que la unica via de recuperar una cuenta fallaba de forma indistinguible del exito.
# Credenciales en Brevo > SMTP & API > SMTP. El login NO es el correo de la cuenta,
# es el "login" que da Brevo; la clave es la SMTP key, no la contrasena de Brevo.
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Remitente, tambien OBLIGATORIO y sin default. Tiene que ser una direccion verificada en
# Brevo (o de un dominio autenticado); con cualquier otra el proveedor rechaza el envio, el
# catch de EmailService se traga el fallo y /auth/forgot-password responde 200 igualmente.
# El default anterior apuntaba a un dominio que no es del proyecto, asi que no habria salido
# ni un correo. Formato: Nombre <direccion@dominio>.
app.mail.from=${MAIL_FROM}

# --- Logging ---
logging.level.root=INFO
logging.level.com.gymprofit.api=INFO

# --- Swagger deshabilitado en producción (no exponer el mapa de la API) ---
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
