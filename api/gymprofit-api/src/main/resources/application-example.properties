# Base de datos MariaDB local
spring.datasource.url=jdbc:mariadb://localhost:3308/my_database
spring.datasource.username=root
spring.datasource.password=secret
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Configuracion de conexion
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JPA/Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Logging
logging.level.root=INFO
logging.level.com.gymprofit.api=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Security JWT (desarrollo - cambiar en produccion)
# El secreto DEBE ser distinto por entorno y venir de una variable de entorno JWT_SECRET
# (Base64 de una clave larga y aleatoria). En dev se puede dejar un default local; en prod NO.
#   dev  -> jwt.secret=${JWT_SECRET:<clave_base64_de_desarrollo>}
#   prod -> jwt.secret=${JWT_SECRET}   (sin default; la app no arranca si no está definida)
jwt.secret=${JWT_SECRET:my_dev_secret_base64}
# Caducidad del access token en ms (recomendado corto, p. ej. 1800000 = 30 min)
jwt.expiration=1800000
# Swagger/OpenAPI: en PRODUCCION deshabilitarlo para no exponer el mapa de la API a anonimos.
#   prod -> springdoc.api-docs.enabled=false
#           springdoc.swagger-ui.enabled=false
# Caducidad del refresh token en ms (largo, p. ej. 2592000000 = 30 dias)
jwt.refresh.expiration=2592000000

# --- Usuario administrador semilla ---
# DataInitializer solo crea la cuenta 'admin' si esta propiedad trae contrasena.
#   dev  -> app.seed.admin.password=<contrasena_local>   (fichero gitignoreado)
#   prod -> app.seed.admin.password=${ADMIN_PASSWORD:}   (sin ADMIN_PASSWORD no hay ADMIN)
# Nunca una contrasena literal en un fichero versionado: seria una cuenta de
# administracion publica. La cuenta 'guest' se crea siempre, pero con contrasena
# aleatoria: POST /auth/guest no usa credenciales.
app.seed.admin.password=<contrasena_local_de_desarrollo>

# --- Correo transaccional (Brevo, SMTP) ---
# Solo se usa para el codigo de recuperacion de contrasena.
#   dev/ci -> se puede dejar vacio: sin JavaMailSender el codigo se escribe en el
#             buzon local app.mail.outbox.dir (por defecto target/mail-outbox), NUNCA
#             en el log (un codigo vale como contrasena durante 15 minutos).
#   prod   -> OBLIGATORIO y sin default: MAIL_HOST, MAIL_USERNAME, MAIL_PASSWORD y
#             MAIL_FROM. Si falta cualquiera, la app no arranca. Con default,
#             /auth/forgot-password respondia 200 sin enviar nada.
# Credenciales en Brevo > SMTP & API > SMTP. El login NO es el correo de la cuenta,
# es el "login" que da Brevo; la clave es la SMTP key, no la contrasena de Brevo.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.mail.outbox.dir=target/mail-outbox
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Remitente. En prod va sin default (app.mail.from=${MAIL_FROM}) y la direccion DEBE estar
# verificada en el proveedor, o de un dominio autenticado: si no, Brevo rechaza el envio.
app.mail.from=${MAIL_FROM:GymProFit <no-reply@gymprofit.app>}
