# Base de datos MariaDB local
spring.datasource.url=jdbc:mariadb://localhost:3308/my_database
spring.datasource.username=root
spring.datasource.password=secret
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Configuracion de conexion
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JPA/Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Logging
logging.level.root=INFO
logging.level.com.gymprofit.api=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Security JWT (desarrollo - cambiar en produccion)
# El secreto DEBE ser distinto por entorno y venir de una variable de entorno JWT_SECRET
# (Base64 de una clave larga y aleatoria). En dev se puede dejar un default local; en prod NO.
#   dev  -> jwt.secret=${JWT_SECRET:<clave_base64_de_desarrollo>}
#   prod -> jwt.secret=${JWT_SECRET}   (sin default; la app no arranca si no está definida)
jwt.secret=${JWT_SECRET:my_dev_secret_base64}
# Caducidad del access token en ms (recomendado corto, p. ej. 1800000 = 30 min)
jwt.expiration=1800000
# Swagger/OpenAPI: en PRODUCCION deshabilitarlo para no exponer el mapa de la API a anonimos.
#   prod -> springdoc.api-docs.enabled=false
#           springdoc.swagger-ui.enabled=false
# Caducidad del refresh token en ms (largo, p. ej. 2592000000 = 30 dias)
jwt.refresh.expiration=2592000000

# --- Correo transaccional (Brevo, SMTP) ---
# Solo se usa para el codigo de recuperacion de contrasena. Si MAIL_HOST no esta
# definida, Spring no crea ningun JavaMailSender y EmailService escribe el codigo
# en el log en vez de fallar: la API arranca igual sin credenciales de correo.
# Credenciales en Brevo > SMTP & API > SMTP. El login NO es el correo de la cuenta,
# es el "login" que da Brevo; la clave es la SMTP key, no la contrasena de Brevo.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Remitente. Sin dominio propio todavia, va el remitente compartido de Brevo.
app.mail.from=${MAIL_FROM:GymProFit <no-reply@gymprofit.app>}
