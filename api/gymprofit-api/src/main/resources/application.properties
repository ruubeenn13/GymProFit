# Perfil activo por defecto
spring.profiles.active=dev

# Nombre de la aplicacion
spring.application.name=GymProFit API

# Configuracion de Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Spring Data REST (GP-186): solo se publica un repositorio que lo pida con su
# anotacion. Ninguno lo pide: la API se sirve con controladores propios, y la libreria
# esta por su resolvedor de excepciones (WebConfig). Vale para todos los perfiles.
spring.data.rest.detection-strategy=annotated

# JPA
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate

# Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

server.servlet.context-path=/api

# Subidas (GP-188): la unica es la foto de perfil, que la app manda en 512 x 512 y
# decenas de KB. Tope de 1 MB en todos los perfiles; por encima, 413 con su mensaje
# (ControllerExceptionHandler). Tras el error, Tomcat se traga hasta 10 MB del resto
# del cuerpo sin guardarlo, para que el cliente reciba el 413 y no una conexion
# cortada; mas que eso, corta.
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1100KB
server.tomcat.max-swallow-size=10MB

# i18n de notificaciones push (messages.properties = ES default, messages_en = EN).
# Sin fallback al locale del sistema: si el servidor corre con locale "en" (Render/CI),
# pedir "es" caeria a messages_en; con false cae SIEMPRE al bundle base (español).
spring.messages.fallback-to-system-locale=false

# Idioma de la petición (GP-109): el del Accept-Language, y ESPAÑOL si no llega. Sin
# esto, una petición sin cabecera tomaba el idioma del servidor, que en Render es inglés:
# así salían en inglés los mensajes de validación en producción.
spring.web.locale=es
spring.web.locale-resolver=accept-header

# Actuator: health (health-check de la PaaS) e info (qué commit corre, GP-100), sin detalles
# internos. info solo lleva lo que aporta CommitInfoContributor: los contribuidores por
# defecto se apagan para que ninguno añada entorno, build o git a una ruta pública.
management.endpoints.web.exposure.include=health,info
management.info.defaults.enabled=false
management.endpoint.health.show-details=never

# Firebase Cloud Messaging (push). La service-account key es un SECRETO: se aporta por
# variable de entorno, nunca en el repo. Ambas vacías por defecto = push DESACTIVADO
# (arranque normal, ideal para CI). Prod (Render): FIREBASE_CREDENTIALS_JSON con el JSON.
# Local: FIREBASE_CREDENTIALS_PATH con la ruta al fichero de la key (gitignoreado).
firebase.credentials.json=${FIREBASE_CREDENTIALS_JSON:}
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}
