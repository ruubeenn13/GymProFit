# Perfil activo por defecto
spring.profiles.active=dev

# Nombre de la aplicacion
spring.application.name=GymProFit API

# Configuracion de Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JPA
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate

# Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

server.servlet.context-path=/api

# i18n de notificaciones push (messages.properties = ES default, messages_en = EN).
# Sin fallback al locale del sistema: si el servidor corre con locale "en" (Render/CI),
# pedir "es" caeria a messages_en; con false cae SIEMPRE al bundle base (español).
spring.messages.fallback-to-system-locale=false

# Actuator: solo el endpoint health expuesto (health-check de la PaaS), sin detalles internos
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Firebase Cloud Messaging (push). La service-account key es un SECRETO: se aporta por
# variable de entorno, nunca en el repo. Ambas vacías por defecto = push DESACTIVADO
# (arranque normal, ideal para CI). Prod (Render): FIREBASE_CREDENTIALS_JSON con el JSON.
# Local: FIREBASE_CREDENTIALS_PATH con la ruta al fichero de la key (gitignoreado).
firebase.credentials.json=${FIREBASE_CREDENTIALS_JSON:}
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}
# MailHealthIndicator DESACTIVADO. No lo borres pensando que sobra.
# Al añadir spring-boot-starter-mail, Actuator registra un MailHealthIndicator que abre una
# conexión SMTP real en CADA consulta de /api/actuator/health. Render bloquea el SMTP saliente
# en el plan gratuito, así que esa conexión agota su timeout (10 s), el health tarda más de 10 s
# y Render mata la instancia porque su propio health check corta a los 5 s: la API entera caída
# por un proveedor de correo inalcanzable.
# El criterio, más allá de este incidente: el health check debe responder si ESTE servicio puede
# atender peticiones, no si un proveedor externo está disponible. Una dependencia de terceros no
# puede tener la capacidad de tumbar el arranque.
management.health.mail.enabled=false
