# Solo para los tests: Spring Boot carga classpath:/config/application.properties ADEMÁS del
# application.properties principal (no lo sustituye) y con más prioridad.
#
# Bloqueo mínimo de ShedLock a cero (GP-221): en producción un bloqueo se queda cogido 50 s
# aunque la tarea acabe antes, para que la otra instancia no repita el ciclo. Los tests
# llaman a una misma tarea varias veces seguidas y la segunda se saltaría.
# TareasUnaVezConDosInstanciasTest lo devuelve al valor de producción, que es lo que prueba.
app.tareas.bloqueo-minimo=PT0S

# Que ShedLock diga en el log de los tests cuándo coge, suelta o se salta un bloqueo: si una
# tarea no corre en un test, la causa queda a la vista.
logging.level.net.javacrumbs.shedlock=DEBUG
